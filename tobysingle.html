<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toby Web</title>
</head>
<body>
<script>
// jsDelivr caches the @main branch resolution for hours, so resolve the
// branch to a commit first (one tiny uncached API call), then pull the
// commit-pinned file — CDN delivery, always current.
fetch("https://api.github.com/repos/Camzzz-vrgt/Toby-Web/commits/main", { cache: "no-store" })
  .then(r => r.json())
  .then(d => "https://cdn.jsdelivr.net/gh/Camzzz-vrgt/Toby-Web@" + d.sha + "/tobywebsinglefile.html")
  .catch(() => "https://cdn.jsdelivr.net/gh/Camzzz-vrgt/Toby-Web@main/tobywebsinglefile.html")
  .then(url => fetch(url, { cache: "no-store" }))
  .then(r => r.text())
  .then(h => {
    document.open();
    document.write(h);
    document.close();
  })
  .catch(e => alert(e));
</script>
</body>
</html>
