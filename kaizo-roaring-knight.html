<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaizo Roaring Knight</title>
  <style>
    @font-face {
      font-family: "Deltarune";
      src: url("https://cdn.jsdelivr.net/gh/storynetwork-camzzz/DUL@main/files/font.otf") format("opentype");
      font-display: swap;
    }

    :root {
      --base: #05060f;
      --void: #000000;
      --blue: #101a6d;
      --bright: #f8fbff;
      --glow: #75a9ff;
      --danger: #e71932;
      --gold: #fff26e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--void);
      color: var(--bright);
      font-family: "Deltarune", monospace;
      letter-spacing: 0;
    }

    body {
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(85, 128, 255, 0.26), transparent 16rem),
        linear-gradient(135deg, #050711 0%, #090d31 42%, #000000 100%);
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.84;
      background-image:
        repeating-linear-gradient(0deg, transparent 0 13px, rgba(255,255,255,0.08) 13px 14px),
        radial-gradient(circle at 18% 21%, white 0 2px, transparent 3px),
        radial-gradient(circle at 78% 18%, white 0 2px, transparent 3px),
        radial-gradient(circle at 70% 78%, white 0 2px, transparent 3px),
        radial-gradient(circle at 24% 74%, white 0 2px, transparent 3px);
    }

    .sigil {
      position: fixed;
      width: min(58vw, 620px);
      aspect-ratio: 1;
      opacity: 0.18;
      border: 3px solid rgba(255,255,255,0.55);
      transform: rotate(45deg);
      box-shadow: 0 0 42px rgba(117,169,255,0.42), inset 0 0 42px rgba(117,169,255,0.28);
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(92vw, 780px);
      padding: 22px;
      border: 3px solid var(--bright);
      background: rgba(0,0,0,0.78);
      box-shadow: 0 0 0 5px #000000, 0 0 42px rgba(117,169,255,0.36);
    }

    .title {
      margin: 0 0 8px;
      font-size: clamp(2rem, 7vw, 4.8rem);
      line-height: 0.95;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 3px 0 var(--blue), -3px 0 var(--blue), 0 0 18px rgba(255,255,255,0.34);
    }

    .subtitle {
      margin: 0 0 26px;
      color: var(--glow);
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      text-align: center;
      text-transform: uppercase;
    }

    .knight {
      width: 96px;
      height: 96px;
      margin: 0 auto 22px;
      position: relative;
      filter: drop-shadow(0 0 18px rgba(117,169,255,0.75));
    }

    .knight::before,
    .knight::after {
      content: "";
      position: absolute;
      inset: 22px;
      border: 5px solid var(--bright);
      transform: rotate(45deg);
      background: rgba(16, 26, 109, 0.75);
    }

    .knight::after {
      inset: 42px 38px 10px;
      border-color: var(--danger);
      background: var(--danger);
      transform: rotate(45deg);
    }

    .actions {
      display: grid;
      gap: 12px;
    }

    button {
      min-height: 52px;
      border: 3px solid transparent;
      background: #000000;
      color: var(--bright);
      font: inherit;
      font-size: clamp(1rem, 3vw, 1.4rem);
      text-transform: uppercase;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      color: var(--gold);
      border-color: var(--bright);
      outline: none;
    }

    button.danger:hover,
    button.danger:focus-visible {
      color: var(--danger);
      border-color: var(--danger);
    }

    .status {
      min-height: 1.3em;
      margin-top: 18px;
      color: var(--glow);
      font-size: 1rem;
      text-align: center;
      text-transform: uppercase;
    }

    .small {
      margin: 18px 0 0;
      color: rgba(255,255,255,0.72);
      font-size: 0.86rem;
      line-height: 1.35;
      text-align: center;
    }

    @media (max-width: 560px) {
      body {
        overflow: auto;
        padding: 14px;
      }

      .shell {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="sigil"></div>

  <main class="shell">
    <div class="knight" aria-hidden="true"></div>
    <h1 class="title">Kaizo Roaring Knight</h1>
    <p class="subtitle">Chapter 3</p>

    <div class="actions">
      <button onclick="startGame()">Start Chapter 3</button>
      <button onclick="installDefaultSave(true)">Reinstall Save</button>
      <button class="danger" onclick="clearSave()">Wipe Browser Save</button>
    </div>

    <div id="status" class="status">Save file is included.</div>
    <p class="small">Single-file launcher. Game files load from storynetwork-camzzz/DUL.</p>
  </main>

  <script>
    const HOST_BASE = "https://cdn.jsdelivr.net/gh/storynetwork-camzzz/DUL@main/files/kaizo-roaring-knight/";
    const CHAPTER_URL = HOST_BASE + "chapter3/index.html";
    const SAVE_URL = HOST_BASE + "saves/filech3_0";
    const SAVE_DB = "/_savedata";
    const SAVE_STORE = "FILE_DATA";
    const SAVE_KEY = "/_savedata/filech3_0";
    const SAVE_MODE = 33206;

    const status = document.getElementById("status");

    function setStatus(text) {
      status.textContent = text;
    }

    function openSaveDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(SAVE_DB, 21);
        request.onupgradeneeded = event => {
          const db = request.result;
          const store = db.objectStoreNames.contains(SAVE_STORE)
            ? event.target.transaction.objectStore(SAVE_STORE)
            : db.createObjectStore(SAVE_STORE);
          if (!store.indexNames.contains("timestamp")) {
            store.createIndex("timestamp", "timestamp", { unique: false });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        request.onblocked = () => reject(new Error("Close other tabs using this site, then try again."));
      });
    }

    function getRecord(store, key) {
      return new Promise((resolve, reject) => {
        const request = store.get(key);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function putRecord(store, key, value) {
      return new Promise((resolve, reject) => {
        const request = store.put(value, key);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    async function installDefaultSave(force) {
      try {
        setStatus("Checking save...");
        let db = await openSaveDatabase();
        try {
          const tx = db.transaction(SAVE_STORE, "readonly");
          const store = tx.objectStore(SAVE_STORE);
          const existing = await getRecord(store, SAVE_KEY);
          if (existing && !force) {
            setStatus("Save already installed.");
            return;
          }
        } finally {
          db.close();
        }

        const response = await fetch(SAVE_URL);
        if (!response.ok) throw new Error("Could not download the save file.");
        const contents = new Uint8Array(await response.arrayBuffer());

        db = await openSaveDatabase();
        try {
          const tx = db.transaction(SAVE_STORE, "readwrite");
          const store = tx.objectStore(SAVE_STORE);
          await putRecord(store, SAVE_KEY, {
            timestamp: new Date(),
            mode: SAVE_MODE,
            contents
          });
        } finally {
          db.close();
        }
        setStatus("Save installed.");
      } catch (err) {
        setStatus("Save install failed.");
        alert("Save install failed.\n\n" + (err && err.message ? err.message : err));
      }
    }

    function deleteDatabase(name) {
      return new Promise((resolve, reject) => {
        const request = indexedDB.deleteDatabase(name);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
        request.onblocked = () => reject(new Error("Close other tabs using this site, then try again."));
      });
    }

    async function clearSave() {
      if (!confirm("Wipe this website's browser save?")) return;
      try {
        setStatus("Wiping save...");
        await deleteDatabase(SAVE_DB);
        localStorage.clear();
        setStatus("Save wiped.");
      } catch (err) {
        setStatus("Wipe failed.");
        alert("Wipe failed.\n\n" + (err && err.message ? err.message : err));
      }
    }

    async function loadRemotePage(url) {
      const pageUrl = new URL(url, location.href).href;
      const response = await fetch(pageUrl);
      if (!response.ok) throw new Error("Could not load " + pageUrl);
      let html = await response.text();
      const pageBase = pageUrl.slice(0, pageUrl.lastIndexOf("/") + 1);
      html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + pageBase + '">');
      document.open();
      document.write(html);
      document.close();
    }

    async function startGame() {
      try {
        setStatus("Preparing save...");
        await installDefaultSave(false);
        setStatus("Loading Chapter 3...");
        await loadRemotePage(CHAPTER_URL);
      } catch (err) {
        setStatus("Load failed.");
        alert("Chapter 3 could not load.\n\n" + (err && err.message ? err.message : err));
      }
    }
  </script>
</body>
</html>
