<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaizo Roaring Knight</title>
  <style>
    @font-face {
      font-family: "Deltarune";
      src: url("https://cdn.jsdelivr.net/gh/storynetwork-camzzz/DUL@main/files/font.otf") format("opentype");
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: "Deltarune", monospace;
      letter-spacing: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .screen {
      width: min(92vw, 760px);
      text-align: center;
    }

    .logo {
      margin-bottom: 34px;
      color: #aee8ff;
      font-size: clamp(2rem, 7vw, 4rem);
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 0 14px #1d9dff, 3px 0 #0d2e5f, -3px 0 #0d2e5f;
    }

    .menu {
      width: min(100%, 650px);
      margin: 0 auto;
      display: grid;
      gap: 10px;
    }

    .row {
      min-height: 70px;
      padding: 10px 14px;
      border: 3px solid transparent;
      background: #000;
      color: #fff;
      display: grid;
      grid-template-columns: minmax(120px, 0.8fr) minmax(0, 1.2fr);
      align-items: center;
      text-decoration: none;
      cursor: pointer;
    }

    .row:hover,
    .row.selected,
    .row:focus-visible {
      color: #aee8ff;
      border-color: #fff;
      outline: none;
    }

    .chapter {
      font-size: clamp(1.15rem, 3vw, 1.65rem);
      text-align: left;
      text-transform: uppercase;
    }

    .title {
      color: inherit;
      font-size: clamp(1rem, 2.6vw, 1.45rem);
      text-align: right;
      text-transform: uppercase;
    }

    .note {
      min-height: 1.25em;
      margin-top: 22px;
      color: #aee8ff;
      font-size: 1rem;
      text-transform: uppercase;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.82);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(92vw, 560px);
      border: 3px solid #fff;
      background: #000;
      padding: 18px;
      box-shadow: 0 0 0 5px #000, 0 0 32px rgba(174, 232, 255, 0.42);
      text-align: left;
    }

    .modal h2 {
      margin: 0 0 12px;
      color: #aee8ff;
      font-size: 1.45rem;
      text-transform: uppercase;
    }

    .modal p {
      margin: 0 0 16px;
      line-height: 1.35;
      font-size: 1rem;
    }

    .modal-actions {
      display: grid;
      gap: 8px;
    }

    button {
      min-height: 42px;
      border: 3px solid transparent;
      background: #000;
      color: #fff;
      font: inherit;
      font-size: 1rem;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      color: #aee8ff;
      border-color: #fff;
      outline: none;
    }

    button.danger:hover,
    button.danger:focus-visible {
      color: #ff4b6a;
      border-color: #ff4b6a;
    }

    .loading-box {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 30;
      display: none;
      min-width: min(86vw, 430px);
      padding: 20px;
      border: 3px solid #fff;
      background: #000;
      color: #aee8ff;
      transform: translate(-50%, -50%);
      text-align: center;
      text-transform: uppercase;
      box-shadow: 0 0 0 5px #000, 0 0 32px rgba(174, 232, 255, 0.42);
    }

    .loading-box.open {
      display: block;
    }

    @media (max-width: 560px) {
      body {
        overflow: auto;
        padding: 16px;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 4px;
      }

      .chapter,
      .title {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="logo">Kaizo Roaring Knight</div>

    <nav class="menu">
      <a href="javascript:openConfirm()" class="row">
        <span class="chapter">Chapter 3</span>
        <span class="title">Kaizo Roaring Knight</span>
      </a>
    </nav>

    <div id="note" class="note">Save file included</div>
  </main>

  <div id="confirmModal" class="modal-backdrop">
    <div class="modal">
      <h2>Are You Sure?</h2>
      <p>This will wipe the current browser save for this site and load the Kaizo Roaring Knight save instead.</p>
      <p>Back up your main save first if you want to keep it.</p>
      <div class="modal-actions">
        <button onclick="backupSave()">Back Up First</button>
        <button class="danger" onclick="confirmLoad()">Wipe And Load</button>
        <button onclick="closeConfirm()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="loadingBox" class="loading-box">Loading...</div>

  <script>
    const HOST_BASE = "https://cdn.jsdelivr.net/gh/storynetwork-camzzz/DUL@main/files/kaizo-roaring-knight/";
    const CHAPTER_URL = HOST_BASE + "chapter3/index.html";
    const SAVE_URL = HOST_BASE + "saves/filech3_0";
    const SAVE_DB = "/_savedata";
    const SAVE_STORE = "FILE_DATA";
    const SAVE_KEY = "/_savedata/filech3_0";
    const SAVE_MODE = 33206;

    const note = document.getElementById("note");
    const confirmModal = document.getElementById("confirmModal");
    const loadingBox = document.getElementById("loadingBox");

    function setNote(text) {
      note.textContent = text;
    }

    function setLoading(text) {
      loadingBox.textContent = text;
    }

    function openConfirm() {
      confirmModal.classList.add("open");
    }

    function closeConfirm() {
      confirmModal.classList.remove("open");
    }

    function showLoading(text) {
      setLoading(text);
      loadingBox.classList.add("open");
    }

    function hideLoading() {
      loadingBox.classList.remove("open");
    }

    function openSaveDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(SAVE_DB, 21);
        request.onupgradeneeded = event => {
          const db = request.result;
          const store = db.objectStoreNames.contains(SAVE_STORE)
            ? event.target.transaction.objectStore(SAVE_STORE)
            : db.createObjectStore(SAVE_STORE);
          if (!store.indexNames.contains("timestamp")) {
            store.createIndex("timestamp", "timestamp", { unique: false });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        request.onblocked = () => reject(new Error("Close other tabs using this site, then try again."));
      });
    }

    function deleteDatabase(name) {
      return new Promise((resolve, reject) => {
        const request = indexedDB.deleteDatabase(name);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
        request.onblocked = () => reject(new Error("Close other tabs using this site, then try again."));
      });
    }

    function requestToPromise(request) {
      return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function bytesToBase64(bytes) {
      let binary = "";
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    async function exportSaveDatabase() {
      const db = await openSaveDatabase();
      try {
        if (!db.objectStoreNames.contains(SAVE_STORE)) return [];
        const tx = db.transaction(SAVE_STORE, "readonly");
        const store = tx.objectStore(SAVE_STORE);
        const keys = await requestToPromise(store.getAllKeys());
        const values = await requestToPromise(store.getAll());
        return values.map((value, index) => ({
          key: keys[index],
          timestamp: value.timestamp,
          mode: value.mode,
          contents: bytesToBase64(value.contents || new Uint8Array())
        }));
      } finally {
        db.close();
      }
    }

    async function backupSave() {
      try {
        setNote("Creating backup...");
        const backup = {
          format: "kaizo-roaring-knight-save-backup",
          exportedAt: new Date().toISOString(),
          localStorage: { ...localStorage },
          records: await exportSaveDatabase()
        };
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([JSON.stringify(backup)], { type: "application/json" }));
        link.download = "kaizo_save_backup_" + Date.now() + ".json";
        link.click();
        URL.revokeObjectURL(link.href);
        setNote("Backup downloaded");
      } catch (err) {
        setNote("Backup failed");
        alert("Backup failed.\n\n" + (err && err.message ? err.message : err));
      }
    }

    async function installKaizoSave() {
      const response = await fetch(SAVE_URL);
      if (!response.ok) throw new Error("Could not download the Kaizo save.");
      const contents = new Uint8Array(await response.arrayBuffer());
      const db = await openSaveDatabase();
      try {
        const tx = db.transaction(SAVE_STORE, "readwrite");
        const store = tx.objectStore(SAVE_STORE);
        await requestToPromise(store.put({
          timestamp: new Date(),
          mode: SAVE_MODE,
          contents
        }, SAVE_KEY));
      } finally {
        db.close();
      }
    }

    async function loadRemotePage(url) {
      const pageUrl = new URL(url, location.href).href;
      const response = await fetch(pageUrl);
      if (!response.ok) throw new Error("Could not load " + pageUrl);
      let html = await response.text();
      const pageBase = pageUrl.slice(0, pageUrl.lastIndexOf("/") + 1);
      html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + pageBase + '">');
      document.open();
      document.write(html);
      document.close();
    }

    async function confirmLoad() {
      try {
        closeConfirm();
        showLoading("Wiping old save...");
        localStorage.clear();
        await deleteDatabase(SAVE_DB).catch(() => {});
        showLoading("Installing Kaizo save...");
        await installKaizoSave();
        showLoading("Loading Chapter 3...");
        await loadRemotePage(CHAPTER_URL);
      } catch (err) {
        hideLoading();
        setNote("Load failed");
        alert("Chapter 3 could not load.\n\n" + (err && err.message ? err.message : err));
      }
    }

    document.querySelectorAll(".row, button").forEach(el => {
      el.addEventListener("mouseenter", () => setNote("Kaizo Roaring Knight"));
    });
  </script>
</body>
</html>
