<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="data:,"/>
  <title>Bad Time Trio</title>
  <style>
    body { background:#000; margin:0; padding:0; height:100vh;
           display:flex; align-items:center; justify-content:center; }
    canvas { image-rendering: pixelated; }
  </style>
</head>
<body>
<div id="wrap" style="-webkit-user-select:none; width:100vw; height:100vh;
     display:flex; align-items:center; justify-content:center; background:#000;">
    <canvas id="MMFCanvas" width="640" height="480">
    	Your browser does not support Canvas.
    </canvas>
</div>
<script src="src/Runtime.js"></script>
<script src="src/Extensions.js"></script>
<script src="../mobile-controls.js" defer></script>
<script>
    window.addEventListener("load", function() {
        new Runtime("MMFCanvas", "resources/game.cch");
    }, false);
    // F = fullscreen, as in the original game (UltimateFullscreen ext)
    window.addEventListener("keydown", function(e) {
        if (e.key !== 'f' && e.key !== 'F') return;
        var c = document.getElementById('wrap');
        try {
            if (document.fullscreenElement) document.exitFullscreen();
            else if (c && c.requestFullscreen) c.requestFullscreen();
        } catch (err) {}
    }, false);
</script>
<script src="../home-button.js"></script>
</body>
</html>
