<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nightmare Mode Sans</title>
  <script>
    // Deployed layout:  <cyf-root>/nightmaresans/  ->  ../?mod=NightmareSans
    // web-ports layout: /web-ports/<slug>/ -> ../create-your-frisk/?mod=NightmareSans
    var target = new RegExp("/nightmaresans/?$", "i").test(location.pathname)
      ? "../?mod=NightmareSans"
      : "../create-your-frisk/?mod=NightmareSans";
    location.replace(target);
  </script>
</head>
<body style="background:#000">
  <p style="color:#ccc;font-family:sans-serif">Loading <a style="color:#fff" href="../?mod=NightmareSans">Nightmare Mode Sans</a>...</p>
</body>
</html>
