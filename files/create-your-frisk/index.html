<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | CYF</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script>
      // Large assets are stored split as <name>.partN (16MiB chunks). This shim
      // reassembles them transparently for both fetch() and XMLHttpRequest
      // (the old UnityLoader and Unity's runtime downloads use XHR).
      (() => {
        const SPLIT_PARTS = {
          "/Build/build-web.data.unityweb": 7,
          "/Build/build-web.wasm.code.unityweb": 2,
          "/StreamingAssets/gamepack.bin": 13,
        };
        const originalFetch = window.fetch.bind(window);
        const partCountFor = (url) => {
          const path = new URL(url, document.baseURI).pathname;
          for (const suffix in SPLIT_PARTS) if (path.endsWith(suffix)) return SPLIT_PARTS[suffix];
          return 0;
        };
        const fetchParts = (url, count) => (async () => {
          const chunks = [];
          for (let p = 1; p <= count; p += 1) {
            const r = await originalFetch(url + ".part" + p);
            if (!r.ok) throw new Error("Part fetch failed: " + r.status);
            chunks.push(await r.arrayBuffer());
          }
          return new Blob(chunks, { type: "application/octet-stream" });
        })();
        window.fetch = async (input, init) => {
          const url = typeof input === "string" ? input : input.url;
          const count = partCountFor(url);
          if (!count) return originalFetch(input, init);
          const blob = await fetchParts(new URL(url, document.baseURI).href, count);
          return new Response(blob, {
            status: 200,
            headers: { "Content-Length": String(blob.size), "Content-Type": "application/octet-stream" },
          });
        };
        const origOpen = XMLHttpRequest.prototype.open;
        const origSend = XMLHttpRequest.prototype.send;
        const origSetHeader = XMLHttpRequest.prototype.setRequestHeader;
        XMLHttpRequest.prototype.open = function (method, url, async, user, password) {
          const count = partCountFor(url);
          if (count && async !== false) {
            this.__splitUrl = new URL(url, document.baseURI).href;
            this.__splitCount = count;
            this.__splitHeaders = [];
          }
          return origOpen.call(this, method, url, async === undefined ? true : async, user, password);
        };
        XMLHttpRequest.prototype.setRequestHeader = function (name, value) {
          if (this.__splitCount) this.__splitHeaders.push([name, value]);
          return origSetHeader.call(this, name, value);
        };
        XMLHttpRequest.prototype.send = function (body) {
          if (!this.__splitCount) return origSend.call(this, body);
          const xhr = this;
          fetchParts(xhr.__splitUrl, xhr.__splitCount)
            .then(blob => URL.createObjectURL(blob))
            .then(blobUrl => {
              origOpen.call(xhr, "GET", blobUrl, true);
              xhr.__splitHeaders.forEach(([k, v]) => origSetHeader.call(xhr, k, v));
              origSend.call(xhr, null);
            })
            .catch(err => {
              if (typeof xhr.onerror === "function") xhr.onerror(err);
              xhr.dispatchEvent(new ProgressEvent("error"));
            });
        };
      })();
    </script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/build-web.json", {onProgress: UnityProgress});
      // CYF renders at a fixed 640x480. Resize the real canvas (not CSS-scaling,
      // which breaks Unity's mouse coords) to the largest 4:3 box in the window.
      function fitGame() {
        var k = Math.min(window.innerWidth / 640, window.innerHeight / 480);
        var w = Math.max(1, Math.round(640 * k));
        var h = Math.max(1, Math.round(480 * k));
        var gc = document.getElementById("gameContainer");
        if (!gc) return;
        gc.style.width = w + "px";
        gc.style.height = h + "px";
        if (gameInstance.Module && typeof gameInstance.Module.setCanvasSize === "function") {
          gameInstance.Module.setCanvasSize(w, h);
        }
      }
      window.addEventListener("resize", fitGame);
      window.addEventListener("load", fitGame);
      setInterval(fitGame, 500);
    </script>
  </head>
  <body>
    <div id="gameStage">
      <div class="webgl-content">
        <div id="gameContainer" style="width: 640px; height: 480px"></div>
      </div>
    </div>
    <div id="fsButton" title="Fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
      <script src="../mobile-controls.js" defer></script>
</body>
</html>
