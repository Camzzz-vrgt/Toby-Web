<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover">
    <title>JOJORUNE - VS Dio</title>
    <style>
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { display: grid; place-items: center; }
      #unity-canvas {
        display: block;
        width: min(100vw, calc(100vh * 16 / 9)) !important;
        height: min(100vh, calc(100vw * 9 / 16)) !important;
        aspect-ratio: 16 / 9;
        background: #231F20 !important;
      }
    </style>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
    <script>
      (() => {
        const originalFetch = window.fetch.bind(window);
        window.fetch = async (input, init) => {
          const url = new URL(typeof input === "string" ? input : input.url, document.baseURI);
          if (!decodeURIComponent(url.pathname).endsWith("/Build/VS Dio (WebGL).data")) return originalFetch(input, init);

          const chunks = [];
          for (let p = 1; p <= 10; p += 1) {
            const response = await originalFetch(url.href + ".part" + p, init);
            if (!response.ok) return response;
            chunks.push(await response.arrayBuffer());
          }
          const blob = new Blob(chunks, { type: "application/octet-stream" });
          return new Response(blob, {
            status: 200,
            headers: { "Content-Length": String(blob.size), "Content-Type": "application/octet-stream" },
          });
        };
      })();
    </script>
    <script src="Build/VS Dio (WebGL).loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/VS Dio (WebGL).data",
        frameworkUrl: "Build/VS Dio (WebGL).framework.js",
        codeUrl: "Build/VS Dio (WebGL).wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "JOJORUNE - VS Dio",
        productVersion: "1.0",
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
    <script src="../mobile-controls.js" defer></script>
    <script src="../home-button.js"></script>
  </body>
</html>
