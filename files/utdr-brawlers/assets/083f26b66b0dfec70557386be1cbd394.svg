<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="494" height="372" viewBox="0,0,494,372"><g transform="translate(7,6)"><g stroke="none" stroke-miterlimit="10"><path d="M-7,366v-372h494v372z" fill="#000000" stroke-width="NaN"></path><text transform="translate(142.26004,42.80124) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Save code complete!</tspan></text><text transform="translate(15.45786,70.99259) scale(0.28854,0.28854)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">TRIPLE CLICK the save code to fully select it. </tspan><tspan x="0" dy="46.150000000000006px">Then copy-paste it somewhere where you can</tspan><tspan x="0" dy="46.150000000000006px">find it again (like a google doc). </tspan><tspan x="0" dy="46.150000000000006px">Or you can save your code to the cloud and access it later.</tspan><tspan x="0" dy="46.150000000000006px">Next time you play, paste this code in 'load progress'.</tspan></text><text transform="translate(124.63004,345) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#69ff75" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">&lt;Click here to continue&gt;</tspan></text></g></g></svg>