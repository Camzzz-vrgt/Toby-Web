<body>
	<div id="startOverlay">
		<div>Ralsei Shooting Simulator<br><button id="startButton" type="button">Start Game</button></div>
	</div>
	<script>

    (function() {
        //Initialization
        var game = new gdjs.RuntimeGame(gdjs.projectData, gdjs.runtimeGameOptions);
        var renderer = game.getRenderer();
        var setWindowTitle = renderer.setWindowTitle.bind(renderer);
        renderer.setWindowTitle = function(title) {
            setWindowTitle(title || "Ralsei Shooting Simulator");
        };

        //Create a renderer
        renderer.createStandardCanvas(document.body);

        //Bind keyboards/mouse/touch events
        renderer.bindStandardEvents(game.getInputManager(), window, document);

        //Load all assets and start the game
        game.loadAllAssets(function() {
            var overlay = document.getElementById("startOverlay");
            var button = document.getElementById("startButton");
            overlay.style.display = "flex";
            button.addEventListener("click", async function() {
                button.disabled = true;
                if (window.Howler && Howler.ctx && Howler.ctx.state === "suspended") {
                    try { await Howler.ctx.resume(); } catch (error) { console.warn("Audio could not start:", error); }
                }
                overlay.remove();
                game.startGameLoop();
            }, { once: true });
        });
    })();

	</script>

<script src="../home-button.js"></script>
