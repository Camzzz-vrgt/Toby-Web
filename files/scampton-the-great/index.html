<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">
  <title>Scampton The Great</title>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    @keyframes rotation {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    html,
    body {
      background: #000;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas.emscripten {
      display: none;
      border: 0;
      width: 640px;
      height: 480px;
      max-width: none;
      max-height: none;
      object-fit: contain;
      background: #000;
      image-rendering: crisp-edges !important;
      image-rendering: pixelated !important;
      -ms-interpolation-mode: nearest-neighbor;
      transition: opacity 0.2s;
      opacity: 0;
      outline: 0;
      box-shadow: none;
    }

    canvas.active {
      display: block;
      opacity: 1;
    }

    .loading {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      font-family: monospace;
      font-size: 18px;
      text-align: center;
    }

    .spinner {
      height: 40px;
      width: 40px;
      margin-bottom: 10px;
      animation: rotation 0.8s linear infinite;
      border: 5px solid #ff91d7;
      border-top: 5px solid transparent;
      border-radius: 100%;
    }
  </style>
</head>
<body>
  <canvas class="emscripten" id="canvas" width="640" height="480" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div class="loading" id="loadingArea">
    <div class="spinner"></div>
    <div id="status">Loading...</div>
  </div>

  <script>
    const ASSET_VERSION = "scampton-working-loader-v2-20260724";
    const GAME_WIDTH = 640;
    const GAME_HEIGHT = 480;
    const unxParts = [
      "game.unx.part1",
      "game.unx.part2",
      "game.unx.part3",
      "game.unx.part4",
      "game.unx.part5",
      "game.unx.part6",
      "game.unx.part7",
      "game.unx.part8"
    ];
    const dataParts = [
      "runner.data.part1",
      "runner.data.part2"
    ];

    const canvasElement = document.getElementById("canvas");
    const loadingArea = document.getElementById("loadingArea");
    const statusElement = document.getElementById("status");
    let mergedUnxBlob = "";
    let mergedDataBlob = "";

    function assetUrl(path) {
      return path + (path.indexOf("?") === -1 ? "?" : "&") + "v=" + ASSET_VERSION;
    }

    function setStatus(text) {
      statusElement.textContent = text;
    }

    function resizeCanvas() {
      const viewportWidth = window.visualViewport ? window.visualViewport.width : window.innerWidth;
      const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      const scale = Math.min(viewportWidth / GAME_WIDTH, viewportHeight / GAME_HEIGHT);
      canvasElement.style.width = Math.ceil(GAME_WIDTH * scale) + "px";
      canvasElement.style.height = Math.ceil(GAME_HEIGHT * scale) + "px";
    }

    function lockPixelCanvas() {
      canvasElement.width = GAME_WIDTH;
      canvasElement.height = GAME_HEIGHT;
      canvasElement.style.imageRendering = "pixelated";
      resizeCanvas();
    }

    function forceNearestNeighborTextures() {
      const contexts = [window.WebGLRenderingContext, window.WebGL2RenderingContext].filter(Boolean);
      contexts.forEach(Context => {
        const proto = Context.prototype;
        if (!proto || proto.__scamptonNearestNeighborPatch) return;
        proto.__scamptonNearestNeighborPatch = true;
        const originalTexParameteri = proto.texParameteri;
        proto.texParameteri = function(target, pname, param) {
          if (pname === this.TEXTURE_MIN_FILTER || pname === this.TEXTURE_MAG_FILTER) {
            param = this.NEAREST;
          }
          return originalTexParameteri.call(this, target, pname, param);
        };
      });
    }

    window.addEventListener("resize", resizeCanvas);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvas);
    canvasElement.addEventListener("click", () => canvasElement.focus());
    forceNearestNeighborTextures();
    lockPixelCanvas();

    var g_pWadLoadCallback;
    function setWadLoadCallback(wadLoadCallback) { g_pWadLoadCallback = wadLoadCallback; }
    var g_pAddAsyncMethod = -1;
    function setAddAsyncMethod(asyncMethod) { g_pAddAsyncMethod = asyncMethod; }
    var g_pJSExceptionHandler;
    function setJSExceptionHandler(exceptionHandler) { g_pJSExceptionHandler = exceptionHandler; }
    function hasJSExceptionHandler() { return typeof g_pJSExceptionHandler === "function"; }
    function doJSExceptionHandler(exceptionJSON) {
      if (typeof g_pJSExceptionHandler === "function") {
        g_pJSExceptionHandler(JSON.parse(exceptionJSON));
      }
    }

    function onFirstFrameRendered() {
      loadingArea.style.display = "none";
      lockPixelCanvas();
      canvasElement.classList.add("active");
      canvasElement.focus();
    }

    function onGameSetWindowSize() {
      lockPixelCanvas();
    }

    const originalOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url) {
      if (typeof url === "string") {
        if (url.indexOf("runner.data") !== -1) url = mergedDataBlob;
        if (url.indexOf("game.unx") !== -1) url = mergedUnxBlob;
      }
      return originalOpen.call(this, method, url, arguments[2], arguments[3], arguments[4]);
    };

    async function fetchAndMerge(urls, label) {
      const buffers = [];
      for (let i = 0; i < urls.length; i++) {
        setStatus("Downloading " + label + "... " + (i + 1) + "/" + urls.length);
        const response = await fetch(assetUrl(urls[i]), { cache: "reload" });
        if (!response.ok) throw new Error("Failed to download " + urls[i]);
        buffers.push(await response.arrayBuffer());
      }
      return new Blob(buffers);
    }

    function manifestFiles() {
      return [
        mergedDataBlob,
        "runner.js",
        "runner.wasm",
        "audio-worklet.js",
        "creep.mp4",
        mergedUnxBlob
      ].join(";");
    }

    function manifestFilesMD5() {
      return ["", "", "", "", "", ""];
    }

    var Module = {
      canvas: canvasElement,
      setStatus: function(text) {
        if (!text) onFirstFrameRendered();
      },
      print: function(text) {
        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(" ");
        console.log(text);
        if (text === "Entering main loop.") {
          onFirstFrameRendered();
        }
      },
      printErr: function(text) {
        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(" ");
        console.error(text);
      },
      locateFile: function(path, prefix) {
        if (path.endsWith(".wasm")) return assetUrl("runner.wasm");
        if (path.endsWith(".audio-worklet.js")) return assetUrl("audio-worklet.js");
        return prefix + path;
      }
    };

    (async function init() {
      try {
        const results = await Promise.all([
          fetchAndMerge(unxParts, "game data"),
          fetchAndMerge(dataParts, "runner data")
        ]);
        mergedUnxBlob = URL.createObjectURL(results[0]);
        mergedDataBlob = URL.createObjectURL(results[1]);

        setStatus("Starting...");
        const script = document.createElement("script");
        script.async = true;
        script.src = assetUrl("runner.js");
        document.body.appendChild(script);
      } catch (error) {
        setStatus("Error");
        console.error(error);
        alert("Scampton The Great could not load.\n\n" + (error && error.message ? error.message : error));
      }
    })();
  </script>
</body>
</html>
