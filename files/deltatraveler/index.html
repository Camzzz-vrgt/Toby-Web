<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover">
    <title>DELTATRAVELER</title>
    <link rel="icon" href="icon.png">
    <style>
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { display: grid; place-items: center; }
      #unity-canvas {
        display: block;
        width: min(100vw, calc(100vh * 4 / 3)) !important;
        height: min(100vh, calc(100vw * 3 / 4)) !important;
        aspect-ratio: 4 / 3;
        image-rendering: pixelated;
        background: #000 !important;
      }
    </style>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width=640 height=480 tabindex="-1"></canvas>
    <script>
      (() => {
        const originalFetch = window.fetch.bind(window);
        window.fetch = async (input, init) => {
          const url = new URL(typeof input === "string" ? input : input.url, document.baseURI);
          if (!url.pathname.endsWith("/Build/DELTATRAVELER.data.unityweb")) return originalFetch(input, init);

          const chunks = [];
          for (let p = 1; p <= 10; p += 1) {
            const response = await originalFetch(url.href + ".part" + p, init);
            if (!response.ok) return response;
            chunks.push(await response.arrayBuffer());
          }
          const blob = new Blob(chunks, { type: "application/octet-stream" });
          return new Response(blob, {
            status: 200,
            headers: { "Content-Length": String(blob.size), "Content-Type": "application/octet-stream" },
          });
        };
      })();
    </script>
    <script src="Build/DELTATRAVELER.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/DELTATRAVELER.data.unityweb",
        frameworkUrl: "Build/DELTATRAVELER.framework.js.unityweb",
        codeUrl: "Build/DELTATRAVELER.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "RynoGG",
        productName: "DELTATRAVELER",
        productVersion: "3.0.13.0114",
        matchWebGLToCanvasSize: false,
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
    <script src="../mobile-controls.js" defer></script>
  </body>
</html>
