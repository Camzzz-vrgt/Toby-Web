<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Lightners Live Plus</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	<style id="dul-port-style">
    html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    #canvas, canvas { width: 100vw !important; height: 100vh !important; image-rendering: pixelated !important; image-rendering: crisp-edges !important; }
    #status-splash { image-rendering: pixelated !important; image-rendering: crisp-edges !important; }
  </style>
</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
const DUL_LIGHTNERS_ENGINE_JS_URL = "index.js";
function loadDulLightnersEngineScript() {
	return fetch(DUL_LIGHTNERS_ENGINE_JS_URL)
		.then((response) => {
			if (!response.ok) {
				throw new Error("Could not load Lightners engine script.");
			}
			return response.text();
		})
		.then((source) => new Promise((resolve, reject) => {
			const script = document.createElement("script");
			const blobUrl = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
			script.src = blobUrl;
			script.onload = () => {
				URL.revokeObjectURL(blobUrl);
				resolve();
			};
			script.onerror = () => {
				URL.revokeObjectURL(blobUrl);
				reject(new Error("Could not start Lightners engine script."));
			};
			document.head.appendChild(script);
		}));
}

loadDulLightnersEngineScript().then(() => {
const DUL_LIGHTNERS_RAW_BASE = "https://raw.githubusercontent.com/storynetwork-camzzz/DUL/main/files/lightners-live-plus/";
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":0,"ensureCrossOriginIsolationHeaders":false,"executable":DUL_LIGHTNERS_RAW_BASE + "index","experimentalVK":false,"fileSizes":{"index.pck":152585384,[DUL_LIGHTNERS_RAW_BASE + "index.wasm"]:1605674},"focusCanvas":true,"gdextensionLibs":[DUL_LIGHTNERS_RAW_BASE + "libgodotmidi.web.template_release.wasm32.wasm"],"godotPoolSize":0,"mainPack":"index.pck"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
const DUL_LIGHTNERS_PACK_URL = "https://media.githubusercontent.com/media/storynetwork-camzzz/DUL/0b1d87a/files/lightners-live-plus/index.pck";
const DUL_LIGHTNERS_PRELOAD_FILE = engine.preloadFile.bind(engine);
engine.preloadFile = function(file, path) {
	if (file === "index.pck") {
		return DUL_LIGHTNERS_PRELOAD_FILE(DUL_LIGHTNERS_PACK_URL, "index.pck");
	}
	return DUL_LIGHTNERS_PRELOAD_FILE(file, path);
};

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
}).catch((err) => {
	console.error(err);
	const statusOverlay = document.getElementById("status");
	const statusNotice = document.getElementById("status-notice");
	if (statusOverlay && statusNotice) {
		statusNotice.textContent = err && err.message ? err.message : "Lightners Live Plus could not start.";
		statusNotice.style.display = "block";
		statusOverlay.style.visibility = "visible";
	}
});
		</script>
	</body>
</html>
