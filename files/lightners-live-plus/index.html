<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1.0">
<title>Deltarune: Lightners Live Plus</title>
<style>
html,body{margin:0;padding:0;border:0;width:100%;height:100%}body{background:#000;color:#fff;overflow:hidden;touch-action:none;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}#canvas{display:block;width:min(100vw,calc(100vh * 896 / 540));height:auto;image-rendering:pixelated}#canvas:focus{outline:none}#status{position:fixed;inset:0;background:#111;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;z-index:2}#status-progress{width:min(560px,70vw)}#status-notice{max-width:780px;margin:20px;padding:18px;background:#421;border:1px solid #a44;border-radius:8px;white-space:pre-wrap;display:none}.small{opacity:.7;font-size:13px}
</style>
<script>
// Threaded Godot build needs crossOriginIsolated (SharedArrayBuffer).
// Install the COOP/COEP worker and reload once so it controls the page.
if (typeof crossOriginIsolated !== "undefined" && !crossOriginIsolated && !sessionStorage.getItem("llplus-coi-reloaded")) {
  sessionStorage.setItem("llplus-coi-reloaded", "1");
  navigator.serviceWorker.register("coi-serviceworker.js").then(function () { location.reload(); }, function () { location.reload(); });
} else {
  sessionStorage.removeItem("llplus-coi-reloaded");
}
</script>
</head>
<body>
<canvas id="canvas" width="896" height="540">Your browser does not support canvas.</canvas>
<div id="status"><h2>Deltarune: Lightners Live Plus</h2><div id="status-text">Loading Godot web runtime…</div><progress id="status-progress"></progress><div id="status-notice"></div><div class="small">Game data: original extracted Godot PCK</div></div>
<script src="../gm-parts-bridge.js"></script>
<script>TobyPartBridge({ "index.pck": ["index.pck.part1", "index.pck.part2", "index.pck.part3", "index.pck.part4", "index.pck.part5", "index.pck.part6", "index.pck.part7", "index.pck.part8", "index.pck.part9", "index.pck.part10"], "index.side.wasm": ["index.side.wasm.part1", "index.side.wasm.part2", "index.side.wasm.part3"] });</script>
<script src="index.js"></script>
<script>
const GODOT_CONFIG={"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":152585384,"index.wasm":1605674},"focusCanvas":true,"gdextensionLibs":["libgodotmidi.web.template_release.wasm32.wasm"],"godotPoolSize":4};
const GODOT_THREADS_ENABLED=true;
const engine=new Engine(GODOT_CONFIG);
(function(){
 const overlay=document.getElementById('status'), progress=document.getElementById('status-progress'), notice=document.getElementById('status-notice'), text=document.getElementById('status-text');
 function fail(err){console.error(err); text.textContent='Failed to start'; notice.style.display='block'; notice.textContent=err instanceof Error?err.message:String(err); progress.style.display='none';}
 const missing=Engine.getMissingFeatures({threads:GODOT_THREADS_ENABLED});
 if(missing.length){fail('Browser is missing required features:\n'+missing.join('\n'));return;}
 engine.startGame({onProgress:(cur,total)=>{if(cur>0&&total>0){progress.value=cur;progress.max=total;text.textContent='Loading game… '+Math.round(cur/total*100)+'%';}else{progress.removeAttribute('value');progress.removeAttribute('max');}}}).then(()=>overlay.remove(),fail);
})();
</script>
<script src="../mobile-controls.js"></script>
</body>
</html>
