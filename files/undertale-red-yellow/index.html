<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Undertale Red &amp; Yellow</title>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    :root { color-scheme: dark; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; }
    body { display: grid; place-items: center; overflow: hidden; }
    #canvas {
      display: block;
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
      aspect-ratio: 4 / 3;
      image-rendering: pixelated;
      background: #000;
    }
    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      color: #fff;
      background: #000;
      font: 14px/1.5 monospace;
      white-space: pre-wrap;
      text-align: center;
      z-index: 2;
    }
    #status[data-ready="true"] { display: none; }
    #status[data-error="true"] {
      display: block;
      overflow: auto;
      text-align: left;
      color: #ff9a9a;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="640" height="480" tabindex="0"></canvas>
  <div id="status">Preparing Undertale Red &amp; Yellow...</div>
  <script type="module">
    import { startButterscotch } from "../butterscotch-host.js";

    const VERSION = "undertale-red-yellow-butterscotch-v1";
    const status = document.querySelector("#status");
    const canvas = document.querySelector("#canvas");

    function setStatus(message) {
      status.textContent = message;
    }

    function setError(error) {
      console.error(error);
      status.dataset.error = "true";
      status.textContent = `Undertale Red & Yellow failed to start.\n\n${error?.stack || error}`;
    }

    async function getDirectory(root, path, create = true) {
      let directory = root;
      for (const segment of path.split("/").filter(Boolean)) {
        directory = await directory.getDirectoryHandle(segment, { create });
      }
      return directory;
    }

    async function writeFile(root, relativePath, bytes) {
      const segments = relativePath.split("/").filter(Boolean);
      const name = segments.pop();
      const directory = await getDirectory(root, segments.join("/"));
      const handle = await directory.getFileHandle(name, { create: true });
      const writable = await handle.createWritable();
      try {
        await writable.write(bytes);
      } finally {
        await writable.close();
      }
    }

    async function fetchBytes(relativePath) {
      const response = await fetch(relativePath, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Missing local asset: ${relativePath} (${response.status})`);
      }
      return response.arrayBuffer();
    }

    async function stageGameFiles() {
      const root = await navigator.storage.getDirectory();
      const marker = await root.getFileHandle("undertale-red-yellow.version", { create: true });
      const markerFile = await marker.getFile();
      if ((await markerFile.text()).trim() === VERSION) {
        return;
      }

      setStatus("Preparing local game data...\nThis first launch downloads the game files into browser storage.");
      const gameDirectory = await getDirectory(root, "games/undertale-red-yellow");
      const saveDirectory = await getDirectory(root, "saves/undertale-red-yellow");

      const runnerManifest = JSON.parse(new TextDecoder().decode(await fetchBytes("runner.json")));
      const externalManifest = JSON.parse(new TextDecoder().decode(await fetchBytes("external-manifest.json")));
      const rootAssets = runnerManifest.manifestFiles.filter(name => name !== "game.unx");
      const total = 1 + rootAssets.length + externalManifest.length;
      let complete = 0;

      const dataHandle = await gameDirectory.getFileHandle("data.win", { create: true });
      const dataWritable = await dataHandle.createWritable();
      try {
        for (let part = 1; part <= 5; part += 1) {
          const bytes = await fetchBytes(`butterscotch-game.part${part}`);
          await dataWritable.write(bytes);
          complete += 0.2;
          setStatus(`Preparing local game data... ${Math.round((complete / total) * 100)}%`);
        }
      } finally {
        await dataWritable.close();
      }

      for (const asset of rootAssets) {
        await writeFile(gameDirectory, asset, await fetchBytes(asset));
        complete += 1;
        setStatus(`Preparing local game data... ${Math.round((complete / total) * 100)}%`);
      }

      for (const asset of externalManifest) {
        await writeFile(root, `external/${asset}`, await fetchBytes(`external/${asset}`));
        complete += 1;
        setStatus(`Preparing local game data... ${Math.round((complete / total) * 100)}%`);
      }

      await saveDirectory.getFileHandle(".keep", { create: true });
      const markerWritable = await marker.createWritable();
      try {
        await markerWritable.write(VERSION);
      } finally {
        await markerWritable.close();
      }
    }

    async function startGame() {
      await stageGameFiles();
      if (!window.crossOriginIsolated) {
        throw new Error("This game requires cross-origin isolation. Start Toby Web with start-local.bat.");
      }
      setStatus("Launching Undertale Red & Yellow...");
      window.__tobyWebRedYellowHost = await startButterscotch({
        canvas,
        gamePath: "/butterscotch/games/undertale-red-yellow/data.win",
        savePath: "/butterscotch/saves/undertale-red-yellow",
      });
      window.__tobyWebRedYellowReady = true;
      status.dataset.ready = "true";
      canvas.focus();
    }

    startGame().catch(setError);
  </script>
  <script src="/files/mobile-controls.js" defer></script>
</body>
</html>
