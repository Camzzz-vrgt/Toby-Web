<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iknowyourethere</title>
  <style>
    html, body, #canvas {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    body {
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #canvas {
      display: block;
      outline: none;
    }

    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
    }

    #status-box {
      width: min(320px, 80vw);
      text-align: center;
    }

    progress {
      width: 100%;
    }

    #notice {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #9b3943;
      border-radius: 6px;
      background: #5b3943;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <canvas id="canvas">Your browser does not support the canvas tag.</canvas>
  <div id="status">
    <div id="status-box">
      <progress id="progress"></progress>
      <div id="notice"></div>
    </div>
  </div>
  <script src="../gm-parts-bridge.js"></script>
  <script>TobyPartBridge({ "iknowyourethere.wasm": ["iknowyourethere.wasm.part1", "iknowyourethere.wasm.part2", "iknowyourethere.wasm.part3"] });</script>
  <script src="godot.js"></script>
  <script>
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const notice = document.getElementById('notice');

    function showError(error) {
      console.error(error);
      progress.style.display = 'none';
      notice.style.display = 'block';
      notice.textContent = error instanceof Error ? error.message : String(error || 'Unable to start.');
    }

    const engine = new Engine({
      executable: 'iknowyourethere',
      mainPack: 'iknowyourethere.pck',
      canvas: document.getElementById('canvas'),
      canvasResizePolicy: 2,
      focusCanvas: true,
      gdextensionLibs: [],
      args: [],
      fileSizes: {
        'godot.web.template_release.wasm32.nothreads.wasm': 39513091,
        'iknowyourethere.pck': 6725368
      }
    });

    const missing = Engine.getMissingFeatures({ threads: false });
    if (missing.length) {
      showError('This browser is missing: ' + missing.join(', '));
    } else {
      engine.startGame({
        onProgress(current, total) {
          if (current > 0 && total > 0) {
            progress.value = current;
            progress.max = total;
          } else {
            progress.removeAttribute('value');
            progress.removeAttribute('max');
          }
        }
      }).then(() => {
        status.remove();
      }).catch(showError);
    }
  </script>
  <script src="../mobile-controls.js" defer></script>
<script src="../home-button.js"></script>
</body>
</html>
