<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Deltarune Guess Who</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --fg: #ffffff;
      --red: #ff2020;
      --yellow: #ffff00;
      --blue: #35f7ff;
      --dim: #6d6d6d;
    }

    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: var(--fg) var(--bg);
    }

    *::-webkit-scrollbar {
      width: 14px;
      height: 14px;
      background: var(--bg);
    }

    *::-webkit-scrollbar-track {
      background: var(--bg);
      border: 2px solid #3a3a3a;
    }

    *::-webkit-scrollbar-thumb {
      background: var(--fg);
      border: 3px solid var(--bg);
    }

    *::-webkit-scrollbar-thumb:hover {
      background: var(--yellow);
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Courier New", monospace;
      image-rendering: pixelated;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }

    button {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 2px solid transparent;
      cursor: pointer;
      image-rendering: pixelated;
    }

    button:hover,
    button:focus-visible {
      color: var(--yellow);
      border-color: var(--yellow);
      outline: none;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      width: 100vw;
      height: 100vh;
      padding: clamp(14px, 2vw, 28px);
      overflow: hidden;
    }

    .topbar,
    .bottombar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      text-transform: uppercase;
    }

    .brand img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .title {
      margin: 0;
      font-size: clamp(30px, 5vw, 72px);
      line-height: 0.9;
      color: var(--red);
      text-shadow:
        0 2px 0 #ffffff,
        2px 0 0 #ffffff,
        -2px 0 0 #ffffff,
        0 -2px 0 #ffffff;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--blue);
      font-size: clamp(12px, 1.8vw, 18px);
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .pixel-button {
      min-height: 40px;
      padding: 8px 12px;
      border-color: var(--fg);
      text-transform: uppercase;
      font-weight: 700;
      background: #050505;
      box-shadow: 3px 3px 0 #303030;
    }

    .main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 250px;
      gap: 18px;
      min-height: 0;
      overflow: hidden;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
      align-content: start;
      min-height: 0;
      overflow: auto;
      padding: 2px 4px 12px 2px;
    }

    .card {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 86px;
      padding: 8px;
      border: 2px solid var(--fg);
      background: #080808;
      text-align: center;
      text-transform: uppercase;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.1;
      overflow: hidden;
    }

    .card::before {
      content: attr(data-initial);
      position: absolute;
      inset: 2px;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.08);
      font-size: 54px;
      line-height: 1;
      pointer-events: none;
    }

    .card span {
      position: relative;
      z-index: 1;
    }

    .card.eliminated {
      color: var(--dim);
      border-color: #444444;
      background:
        linear-gradient(45deg, transparent 47%, var(--red) 48%, var(--red) 52%, transparent 53%),
        linear-gradient(-45deg, transparent 47%, var(--red) 48%, var(--red) 52%, transparent 53%),
        #050505;
    }

    .card.marked {
      color: var(--yellow);
      border-color: var(--yellow);
    }

    .side {
      min-height: 0;
      border: 2px solid var(--fg);
      padding: 14px;
      overflow: auto;
      background: #050505;
    }

    .side h2 {
      margin: 0 0 12px;
      font-size: 18px;
      text-transform: uppercase;
    }

    .secret {
      display: grid;
      place-items: center;
      min-height: 120px;
      margin-bottom: 14px;
      border: 2px solid var(--fg);
      color: var(--red);
      background: #000000;
      text-align: center;
      text-transform: uppercase;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.1;
    }

    .hint {
      margin: 10px 0;
      color: #cccccc;
      font-size: 13px;
      line-height: 1.35;
    }

    .status {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 14px;
      text-transform: uppercase;
      color: #cccccc;
    }

    .status strong {
      color: var(--fg);
    }

    .notice {
      color: var(--blue);
      font-size: 12px;
      line-height: 1.25;
      text-align: right;
      text-transform: uppercase;
    }

    @media (max-width: 760px) {
      body {
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      .topbar,
      .bottombar {
        align-items: flex-start;
        flex-direction: column;
      }

      .controls {
        justify-content: flex-start;
      }

      .main {
        grid-template-columns: 1fr;
        overflow: visible;
      }

      .board {
        max-height: none;
        overflow: visible;
      }

      .side {
        overflow: visible;
      }

      .notice {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img src="icon.png" alt="">
        <div>
          <h1 class="title">Guess Who?</h1>
          <div class="subtitle">Chromebook Mode</div>
        </div>
      </div>
      <div class="controls">
        <button class="pixel-button" id="new-round">New Round</button>
        <button class="pixel-button" id="reveal">Reveal</button>
        <button class="pixel-button" id="clear">Clear Board</button>
      </div>
    </header>

    <section class="main">
      <div class="board" id="board" aria-label="Character board"></div>
      <aside class="side">
        <h2>Secret Card</h2>
        <div class="secret" id="secret">???</div>
        <p class="hint">Click a card to cross it out. Double click to mark a likely guess.</p>
        <p class="hint">This version runs without the Godot renderer so Chromebooks can play it reliably.</p>
      </aside>
    </section>

    <footer class="bottombar">
      <div class="status">
        <span>Left: <strong id="left-count">0</strong></span>
        <span>Crossed Out: <strong id="out-count">0</strong></span>
        <span>Marked: <strong id="marked-count">0</strong></span>
      </div>
      <div class="notice">No embed. No WebGL required.</div>
    </footer>
  </main>

  <script>
    const characters = [
      "Alphys", "Alvin", "Annoying Dog", "Aqua", "Asgore", "Berdly",
      "Blue", "Cap'n", "Carol", "Cowboy Mike", "Dess", "Elnina",
      "Flowery", "Forgotten Man", "Friend", "Gaster", "Green",
      "Jackenstein", "Jevil", "Jockington", "King", "Kris", "K_K",
      "K. Round", "Lancer", "Lanino", "Noelle", "Normal NPC", "Nubert",
      "Old Man", "Onion", "Orange", "Pink", "Pizzapants", "Pluey",
      "QC", "Queen", "Ralsei", "Ramb", "Roaring Knight", "Rouxls Kaard",
      "Rudy", "Sans", "Seam", "Seth", "Shadow Mantle", "Shuttah",
      "Small Mike", "Soul", "Spamton", "Susie", "Swatch", "Sweet",
      "Tenna", "The Original Starwalker", "Toriel", "Trashy", "Undyne",
      "Watercooler", "Yellow"
    ];

    const board = document.getElementById("board");
    const secret = document.getElementById("secret");
    const leftCount = document.getElementById("left-count");
    const outCount = document.getElementById("out-count");
    const markedCount = document.getElementById("marked-count");
    let secretName = "";

    function updateCounts() {
      const cards = [...board.querySelectorAll(".card")];
      leftCount.textContent = cards.filter(card => !card.classList.contains("eliminated")).length;
      outCount.textContent = cards.filter(card => card.classList.contains("eliminated")).length;
      markedCount.textContent = cards.filter(card => card.classList.contains("marked")).length;
    }

    function setSecret(revealed) {
      secret.textContent = revealed ? secretName : "???";
    }

    function newRound() {
      secretName = characters[Math.floor(Math.random() * characters.length)];
      board.querySelectorAll(".card").forEach(card => {
        card.classList.remove("eliminated", "marked");
      });
      setSecret(false);
      updateCounts();
    }

    function buildBoard() {
      board.innerHTML = "";
      characters.forEach(name => {
        const card = document.createElement("button");
        card.className = "card";
        card.type = "button";
        card.dataset.initial = name.replace(/^The /, "").charAt(0);
        card.innerHTML = "<span></span>";
        card.querySelector("span").textContent = name;
        card.addEventListener("click", () => {
          card.classList.toggle("eliminated");
          if (card.classList.contains("eliminated")) {
            card.classList.remove("marked");
          }
          updateCounts();
        });
        card.addEventListener("dblclick", event => {
          event.preventDefault();
          card.classList.remove("eliminated");
          card.classList.toggle("marked");
          updateCounts();
        });
        board.appendChild(card);
      });
    }

    document.getElementById("new-round").addEventListener("click", newRound);
    document.getElementById("reveal").addEventListener("click", () => setSecret(true));
    document.getElementById("clear").addEventListener("click", () => {
      board.querySelectorAll(".card").forEach(card => card.classList.remove("eliminated", "marked"));
      updateCounts();
    });

    buildBoard();
    newRound();
  </script>
</body>
</html>
