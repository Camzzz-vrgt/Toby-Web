<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="icon.jpg">
  <title>Undertale: The Roaring Knight</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; color: #fff; }
    body { display: grid; place-items: center; overflow: hidden; font-family: Arial, sans-serif; }
    #game-shell { position: relative; width: min(100vw, calc(100vh * 4 / 3)); aspect-ratio: 4 / 3; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; outline: none; }
    #loading {
      position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
      background: #000; text-align: center;
    }
    #loading[hidden] { display: none; }
    #panel { width: min(430px, 100%); }
    h1 { margin: 0 0 18px; font-size: clamp(22px, 5vw, 36px); letter-spacing: 0; }
    #status { min-height: 42px; margin: 0 0 14px; color: #c8c8c8; line-height: 1.4; }
    progress { width: 100%; height: 14px; accent-color: #fff; }
    button {
      min-width: 180px; margin-top: 20px; padding: 11px 18px; border: 2px solid #fff;
      background: #000; color: #fff; font: 700 16px Arial, sans-serif; cursor: pointer;
    }
    button:hover, button:focus-visible { background: #fff; color: #000; }
    button[hidden] { display: none; }
    #error { color: #ff6969; white-space: pre-wrap; }
  </style>
  <script src="coi-serviceworker.js"></script>
</head>
<body>
  <main id="game-shell">
    <canvas id="game" width="640" height="480" tabindex="0" aria-label="Undertale: The Roaring Knight"></canvas>
    <section id="loading" aria-live="polite">
      <div id="panel">
        <h1>UNDERTALE: THE ROARING KNIGHT</h1>
        <p id="status">Preparing the local game files...</p>
        <progress id="progress" max="1" value="0"></progress>
        <p id="error" hidden></p>
        <button id="start" type="button" hidden>START GAME</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
