      function splitUrlSuffix(url) {
        const queryIndex = url.indexOf("?");
        const hashIndex = url.indexOf("#");
        let suffixIndex = -1;
        if (queryIndex !== -1 && hashIndex !== -1) {
          suffixIndex = Math.min(queryIndex, hashIndex);
        } else {
          suffixIndex = Math.max(queryIndex, hashIndex);
        }
        return suffixIndex === -1
          ? { clean: url, suffix: "" }
          : { clean: url.slice(0, suffixIndex), suffix: url.slice(suffixIndex) };
      }

      function resolveAudioAlias(url) {
        if (typeof url !== "string") {
          return url;
        }
        const split = splitUrlSuffix(url);
        const lowerClean = split.clean.toLowerCase();
        const markers = ["assets/audio/", "audio/"];
        for (let i = 0; i < markers.length; i++) {
          const marker = markers[i];
          const markerIndex = lowerClean.lastIndexOf(marker);
          if (markerIndex === -1) {
            continue;
          }
          const requestedPath = lowerClean.slice(markerIndex);
          const canonicalPath = AUDIO_FILE_ALIASES[requestedPath];
          if (canonicalPath) {
            return split.clean.slice(0, markerIndex) + canonicalPath + split.suffix;
          }
        }
        return url;
      }

      function cacheBustAssetUrl(url) {
        if (typeof url !== "string" || url.indexOf("blob:") === 0 || url.indexOf("data:") === 0) {
          return url;
        }
        url = resolveAudioAlias(url);
        if (url.indexOf("game.unx") !== -1 || url.indexOf("runner.data") !== -1 || url.toLowerCase().indexOf("audio/") !== -1) {
          if (url.indexOf("v=" + ASSET_VERSION) !== -1) {
            return url;
          }
          return url + (url.indexOf("?") === -1 ? "?" : "&") + "v=" + ASSET_VERSION;
        }
        return url;
      }

      function setStatusText(text) {
        statusElement.textContent = text || "";
      }

      function showCanvas() {
        loadingElement.classList.add("hidden");
        canvasElement.classList.add("active");
        canvasElement.focus();
      }

      async function fetchParts(parts, label, progressState) {
        const buffers = [];
        for (let i = 0; i < parts.length; i++) {
          setStatusText("Downloading " + label + "... " + (i + 1) + "/" + parts.length);
          const response = await fetch(cacheBustAssetUrl(parts[i]), { cache: "reload" });
          if (!response.ok) {
            throw new Error("Could not load " + parts[i]);
          }
          const data = await response.arrayBuffer();
          buffers.push(data);
          progressState.done++;
          progressElement.value = Math.round((progressState.done / TOTAL_ASSET_PARTS) * 100);
        }
        return buffers;
      }

      function makeBlobUrl(buffers) {
        return URL.createObjectURL(new Blob(buffers, { type: "application/octet-stream" }));
      }

      async function prepareGameAssets() {
        const progressState = { done: 0 };
        mergedGameUrl = makeBlobUrl(await fetchParts(GAME_PARTS, "game data", progressState));
        const runnerDataBuffers = await fetchParts(RUNNER_DATA_PARTS, "runner package", progressState);
        runnerDataUrl = makeBlobUrl(runnerDataBuffers);
        setStatusText("Preparing data...");
      }

      function installGameDataInterceptor() {
        const originalFetch = window.fetch.bind(window);
        window.fetch = function(resource, options) {
          if (typeof resource === "string" && resource.indexOf("game.unx") !== -1) {
            resource = mergedGameUrl;
          } else if (typeof resource === "string" && resource.indexOf("runner.data") !== -1) {
            resource = runnerDataUrl;
          } else if (typeof resource === "string" && resource.indexOf("audio/") !== -1) {
            resource = cacheBustAssetUrl(resource);
          } else if (resource instanceof Request && resource.url.indexOf("game.unx") !== -1) {
            resource = new Request(mergedGameUrl, resource);
          } else if (resource instanceof Request && resource.url.indexOf("runner.data") !== -1) {
            resource = new Request(runnerDataUrl, resource);
          } else if (resource instanceof Request && resource.url.indexOf("audio/") !== -1) {
            resource = new Request(cacheBustAssetUrl(resource.url), resource);
          }
          return originalFetch(resource, options);
        };

        const originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
          if (typeof url === "string" && url.indexOf("game.unx") !== -1) {
            url = mergedGameUrl;
          } else if (typeof url === "string" && url.indexOf("runner.data") !== -1) {
            url = runnerDataUrl;
          } else if (typeof url === "string" && url.indexOf("audio/") !== -1) {
            url = cacheBustAssetUrl(url);
          }
          return originalOpen.call(this, method, url, async, user, password);
        };
      }

      function ensureAspectRatio() {
        if (startingHeight === undefined || startingWidth === undefined) {
          return;
        }

        const maxWidth = window.innerWidth;
        const maxHeight = window.innerHeight;
        const heightQuotient = startingHeight / maxHeight;
        const widthQuotient = startingWidth / maxWidth;
        let newHeight;
        let newWidth;

        if (heightQuotient > widthQuotient) {
          newHeight = maxHeight;
          newWidth = newHeight * startingAspect;
        } else {
          newWidth = maxWidth;
          newHeight = newWidth / startingAspect;
        }

        canvasElement.style.width = newWidth + "px";
        canvasElement.style.height = newHeight + "px";
      }

      window.addEventListener("resize", () => window.requestAnimationFrame(ensureAspectRatio));
      setInterval(() => window.requestAnimationFrame(ensureAspectRatio), 1000);

        preRun: [],
        postRun: [],
        print: function(text) {
          if (arguments.length > 1) {
            text = Array.prototype.slice.call(arguments).join(" ");
          }
          if (text === "Entering main loop.") {
            ensureAspectRatio();
          }
          console.log(text);

            text = Array.prototype.slice.call(arguments).join(" ");

          console.error(text);
        },
        canvas: canvasElement,
        setStatus: function(text) {
          if (!Module.setStatus.last) {
            Module.setStatus.last = { time: Date.now(), text: "" };
          }
          if (text === Module.setStatus.last.text) return;
          const match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          const now = Date.now();
          if (match && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last = { time: now, text: text };
          if (!text) {
            showCanvas();
          } else if (text.indexOf("Downloading data...") !== -1) {
            setStatusText("Downloading data...");
          } else {
            setStatusText(match ? match[1] : text);

        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? "Preparing... (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")" : "All downloads complete.");

      const EXTERNAL_AUDIO_MD5 = [];
      const AUDIO_FILE_ALIASES = {};
      const EXTERNAL_AUDIO_ALIAS_FILES = [];
      const EXTERNAL_AUDIO_ALIAS_MD5 = [];
      const KNOWN_EXTERNAL_AUDIO_FILES = {};

      for (let i = 0; i < EXTERNAL_AUDIO_FILES.length; i++) {
        KNOWN_EXTERNAL_AUDIO_FILES[EXTERNAL_AUDIO_FILES[i]] = true;
      }

      for (let i = 0; i < EXTERNAL_AUDIO_FILES.length; i++) {
        const file = EXTERNAL_AUDIO_FILES[i];
        const lowerFile = file.toLowerCase();
        const aliases = [lowerFile, "assets/" + lowerFile];
        AUDIO_FILE_ALIASES[lowerFile] = file;
        AUDIO_FILE_ALIASES["assets/" + lowerFile] = file;

        for (let j = 0; j < aliases.length; j++) {
          const alias = aliases[j];
          if (alias !== file && !KNOWN_EXTERNAL_AUDIO_FILES[alias]) {
            KNOWN_EXTERNAL_AUDIO_FILES[alias] = true;
            EXTERNAL_AUDIO_ALIAS_FILES.push(alias);
            EXTERNAL_AUDIO_ALIAS_MD5.push(EXTERNAL_AUDIO_MD5[i]);
          }
        }
      }

      function manifestFiles() {
        return [
          "runner.data",
          "runner.js",
          "runner.wasm",
          "audio-worklet.js",
          "game.unx"
        ].concat(EXTERNAL_AUDIO_FILES, EXTERNAL_AUDIO_ALIAS_FILES).join(";");
      }

      function manifestFilesMD5() {
        return [
          "34565020f46a5d5930f86f613c522c8c",
          "f096b95b34aff9215ba7148013ac0b1c",
          "974de43c7679838b00db32032d23f470",
          "e8f1e8db8cf996f8715a6f2164c2e44e",
          "b7dd69e98ceba1ca0ad774ca7727e472"
        ].concat(EXTERNAL_AUDIO_MD5, EXTERNAL_AUDIO_ALIAS_MD5);
      }
      function onFirstFrameRendered() {
      }

      function onGameSetWindowSize(width, height) {
        startingWidth = width;
        startingHeight = height;
        startingAspect = startingWidth / startingHeight;
        ensureAspectRatio();
      }

      function pause() {
        if (typeof GM_pause === "function" && canvasElement.classList.contains("active")) {
          GM_pause();
        }
      }

      function resume() {
        if (typeof GM_unpause === "function" && canvasElement.classList.contains("active")) {
          GM_unpause();
          ensureAspectRatio();
        }
      }

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState !== "visible") {
          pause();
        } else {
          resume();
        }
      });

      window.addEventListener("error", event => {
        if (!canvasElement.classList.contains("active")) {
          setStatusText("Exception thrown, see JavaScript console");
        }
        console.error(event.error || event.message);
      });

      setWadLoadCallback(function() {});

      prepareGameAssets()
        .then(() => {
          installGameDataInterceptor();
          const script = document.createElement("script");
          script.async = true;
          script.src = "runner.js?v=" + ASSET_VERSION;
          document.body.appendChild(script);
        })
        .catch(error => {
          setStatusText("Failed to load game data");
          console.error(error);
          alert("DELTARUNE Dreamwake could not load.\n\n" + (error && error.message ? error.message : error));
        });
    </script>
  </body>
</html>
