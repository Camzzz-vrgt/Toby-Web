<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat and Mouse</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; }
    body { display: grid; place-items: center; font-family: monospace; }
    .loader { text-align: center; }
  </style>
</head>
<body>
  <div class="loader">Loading Cat and Mouse...</div>
  <script>
    (async function () {
      const parts = [];
      for (let p = 1; p <= 4; p += 1) parts.push("index.payload.part" + p);
      const baseTag = document.querySelector("base");
      const base = baseTag ? baseTag.href : new URL("./", location.href).href;
      try {
        const chunks = [];
        let totalLength = 0;
        for (let index = 0; index < parts.length; index += 1) {
          document.querySelector(".loader").textContent = "Loading Cat and Mouse " + (index + 1) + "/" + parts.length + "...";
          const response = await fetch(new URL(parts[index], base).href);
          if (!response.ok) throw new Error("Could not load " + parts[index]);
          const chunk = new Uint8Array(await response.arrayBuffer());
          chunks.push(chunk);
          totalLength += chunk.byteLength;
        }
        const merged = new Uint8Array(totalLength);
        let offset = 0;
        for (const chunk of chunks) {
          merged.set(chunk, offset);
          offset += chunk.byteLength;
        }
        const html = new TextDecoder("utf-8").decode(merged);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<pre style="white-space:pre-wrap;padding:24px">Cat and Mouse could not load.\n\n' + (error && error.message ? error.message : error) + '</pre>';
      }
    }());
  </script>
  <script src="../mobile-controls.js" defer></script>
<script src="../home-button.js"></script>
</body>
</html>
