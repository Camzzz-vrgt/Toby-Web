<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1.0">
<title>rhythmrune</title>
<style>
html,body,#canvas{margin:0;padding:0;border:0;width:100%;height:100%}body{background:#000;color:#fff;overflow:hidden;touch-action:none;font-family:Arial,sans-serif}#canvas{display:block}#canvas:focus{outline:none}#status{position:fixed;inset:0;background:#111;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;z-index:2}#status-progress{width:min(560px,70vw)}#status-notice{max-width:780px;margin:20px;padding:18px;background:#421;border:1px solid #a44;border-radius:8px;white-space:pre-wrap;display:none}.small{opacity:.7;font-size:13px}
</style>
</head>
<body>
<canvas id="canvas">Your browser does not support canvas.</canvas>
<div id="status"><h2>rhythmrune</h2><div id="status-text">Loading Godot web runtime…</div><progress id="status-progress"></progress><div id="status-notice"></div><div class="small">Game data: original extracted Godot PCK</div></div>
<script src="../gm-parts-bridge.js"></script>
<script>TobyPartBridge({ "index.wasm": ["index.wasm.part1", "index.wasm.part2", "index.wasm.part3"], "index.pck": ["index.pck.part1", "index.pck.part2", "index.pck.part3", "index.pck.part4", "index.pck.part5", "index.pck.part6", "index.pck.part7", "index.pck.part8", "index.pck.part9", "index.pck.part10", "index.pck.part11", "index.pck.part12"] });</script>
<script src="index.js"></script>
<script>
const GODOT_CONFIG={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":200730128,"index.wasm":37914357},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED=false;
const engine=new Engine(GODOT_CONFIG);
(function(){
 const overlay=document.getElementById('status'), progress=document.getElementById('status-progress'), notice=document.getElementById('status-notice'), text=document.getElementById('status-text');
 function fail(err){console.error(err); text.textContent='Failed to start'; notice.style.display='block'; notice.textContent=err instanceof Error?err.message:String(err); progress.style.display='none';}
 const missing=Engine.getMissingFeatures({threads:false});
 if(missing.length){fail('Browser is missing required features:\n'+missing.join('\n'));return;}
 engine.startGame({onProgress:(cur,total)=>{if(cur>0&&total>0){progress.value=cur;progress.max=total;text.textContent='Loading game… '+Math.round(cur/total*100)+'%';}else{progress.removeAttribute('value');progress.removeAttribute('max');}}}).then(()=>overlay.remove(),fail);
})();
</script>
<script src="../mobile-controls.js"></script>
</body>
</html>
