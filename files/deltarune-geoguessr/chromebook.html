<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Deltarune GeoGuessr</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --fg: #ffffff;
      --dim: #777777;
      --yellow: #ffff00;
      --blue: #35f7ff;
      --red: #ff2020;
      --panel: #070707;
    }

    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: var(--fg) var(--bg);
    }

    *::-webkit-scrollbar {
      width: 14px;
      height: 14px;
      background: var(--bg);
    }

    *::-webkit-scrollbar-track {
      background: var(--bg);
      border: 2px solid #3a3a3a;
    }

    *::-webkit-scrollbar-thumb {
      background: var(--fg);
      border: 3px solid var(--bg);
    }

    *::-webkit-scrollbar-thumb:hover {
      background: var(--yellow);
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Courier New", monospace;
      image-rendering: pixelated;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }

    button {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 2px solid transparent;
      cursor: pointer;
      image-rendering: pixelated;
    }

    button:hover,
    button:focus-visible {
      color: var(--yellow);
      border-color: var(--yellow);
      outline: none;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      width: 100vw;
      height: 100vh;
      padding: clamp(14px, 2vw, 28px);
      overflow: hidden;
    }

    .topbar,
    .bottombar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      text-transform: uppercase;
    }

    .brand img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .title {
      margin: 0;
      font-size: clamp(28px, 4.6vw, 68px);
      line-height: 0.9;
      letter-spacing: 0;
    }

    .title strong {
      color: var(--red);
      text-shadow:
        0 2px 0 #ffffff,
        2px 0 0 #ffffff,
        -2px 0 0 #ffffff,
        0 -2px 0 #ffffff;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--blue);
      font-size: clamp(12px, 1.8vw, 18px);
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .pixel-button {
      min-height: 40px;
      padding: 8px 12px;
      border-color: var(--fg);
      text-transform: uppercase;
      font-weight: 700;
      background: #050505;
      box-shadow: 3px 3px 0 #303030;
    }

    .main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 340px);
      gap: 18px;
      min-height: 0;
      overflow: hidden;
    }

    .viewer,
    .side {
      min-height: 0;
      border: 2px solid var(--fg);
      background: var(--panel);
    }

    .viewer {
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      background: #080812;
      image-rendering: pixelated;
    }

    .caption {
      min-height: 52px;
      padding: 12px;
      border-top: 2px solid var(--fg);
      color: #cccccc;
      text-transform: uppercase;
      line-height: 1.25;
    }

    .side {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      padding: 14px;
      overflow: auto;
    }

    .side h2 {
      margin: 0;
      font-size: 20px;
      text-transform: uppercase;
    }

    .choices {
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .choice {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border-color: var(--fg);
      background: #000000;
      text-align: left;
      text-transform: uppercase;
      font-weight: 700;
    }

    .choice.correct {
      color: var(--blue);
      border-color: var(--blue);
    }

    .choice.wrong {
      color: var(--red);
      border-color: var(--red);
    }

    .result {
      min-height: 48px;
      color: #cccccc;
      text-transform: uppercase;
      line-height: 1.35;
    }

    .status {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 14px;
      text-transform: uppercase;
      color: #cccccc;
    }

    .status strong {
      color: var(--fg);
    }

    .notice {
      color: var(--blue);
      font-size: 12px;
      line-height: 1.25;
      text-align: right;
      text-transform: uppercase;
    }

    @media (max-width: 820px) {
      body {
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      .topbar,
      .bottombar {
        align-items: flex-start;
        flex-direction: column;
      }

      .controls {
        justify-content: flex-start;
      }

      .main {
        grid-template-columns: 1fr;
        overflow: visible;
      }

      .viewer {
        min-height: 52vh;
      }

      .side {
        overflow: visible;
      }

      .notice {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img src="icon.png" alt="">
        <div>
          <h1 class="title">Deltarune <strong>Geo</strong>Guessr</h1>
          <div class="subtitle">Chromebook Mode</div>
        </div>
      </div>
      <div class="controls">
        <button class="pixel-button" id="new-round">New Round</button>
        <button class="pixel-button" id="skip-round">Skip</button>
        <button class="pixel-button" id="audio-toggle">Audio On</button>
      </div>
    </header>

    <section class="main">
      <div class="viewer">
        <canvas id="scene" width="960" height="540" aria-label="Location scene"></canvas>
        <div class="caption" id="caption">Find the location from the scene.</div>
      </div>
      <aside class="side">
        <h2>Where Are You?</h2>
        <div class="choices" id="choices"></div>
        <div class="result" id="result">Pick one answer.</div>
      </aside>
    </section>

    <footer class="bottombar">
      <div class="status">
        <span>Round: <strong id="round">1</strong></span>
        <span>Score: <strong id="score">0</strong></span>
        <span>Streak: <strong id="streak">0</strong></span>
      </div>
      <div class="notice">No embed. No WebGL required.</div>
    </footer>
  </main>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const choicesEl = document.getElementById("choices");
    const resultEl = document.getElementById("result");
    const captionEl = document.getElementById("caption");
    const roundEl = document.getElementById("round");
    const scoreEl = document.getElementById("score");
    const streakEl = document.getElementById("streak");
    const audioToggle = document.getElementById("audio-toggle");

    let audioEnabled = localStorage.getItem("dul_geo_audio") !== "off";
    let audioContext = null;
    let current = null;
    let score = 0;
    let streak = 0;
    let round = 1;
    let locked = false;

    const locations = [
      {
        name: "Castle Town",
        caption: "A quiet dark town with glowing windows and a fountain.",
        colors: ["#101025", "#1d1b3f", "#4cc9f0", "#ffffff"],
        draw: drawCastleTown
      },
      {
        name: "Card Castle",
        caption: "A tall spade tower surrounded by card suits.",
        colors: ["#080808", "#202020", "#ffffff", "#a00000"],
        draw: drawCardCastle
      },
      {
        name: "Cyber Field",
        caption: "A neon road through a blue grid world.",
        colors: ["#05051a", "#1ef7ff", "#ff39f7", "#ffff00"],
        draw: drawCyberField
      },
      {
        name: "Queen Mansion",
        caption: "A polished palace with gold trim and battery signs.",
        colors: ["#1b1035", "#ffd447", "#35f7ff", "#ffffff"],
        draw: drawQueenMansion
      },
      {
        name: "TV Studio",
        caption: "Spotlights, stage panels, and a giant screen.",
        colors: ["#090909", "#ffffff", "#ff2020", "#35f7ff"],
        draw: drawTvStudio
      },
      {
        name: "Hometown",
        caption: "Snowy roads, small houses, and warm windows.",
        colors: ["#0b1020", "#dff6ff", "#ffdd7a", "#355c7d"],
        draw: drawHometown
      },
      {
        name: "School",
        caption: "A classroom hallway with lockers and a closet door.",
        colors: ["#101010", "#b06935", "#d8d8d8", "#4a7a39"],
        draw: drawSchool
      },
      {
        name: "Dark Fountain",
        caption: "A bright fountain cutting through the black.",
        colors: ["#000000", "#ffffff", "#5bf7ff", "#202040"],
        draw: drawDarkFountain
      }
    ];

    function playTone(frequency, duration, type) {
      if (!audioEnabled) return;
      try {
        audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = type || "square";
        osc.frequency.value = frequency;
        gain.gain.value = 0.04;
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
        osc.stop(audioContext.currentTime + duration);
      } catch (err) {}
    }

    function setAudioButton() {
      audioToggle.textContent = audioEnabled ? "Audio On" : "Audio Off";
      localStorage.setItem("dul_geo_audio", audioEnabled ? "on" : "off");
    }

    function pixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    }

    function line(x1, y1, x2, y2, color, width) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width || 4;
      ctx.beginPath();
      ctx.moveTo(Math.round(x1), Math.round(y1));
      ctx.lineTo(Math.round(x2), Math.round(y2));
      ctx.stroke();
    }

    function text(label, x, y, size, color) {
      ctx.fillStyle = color;
      ctx.font = "700 " + size + "px Courier New, monospace";
      ctx.fillText(label, x, y);
    }

    function clearScene(bg) {
      pixelRect(0, 0, canvas.width, canvas.height, bg);
    }

    function drawCastleTown() {
      clearScene("#080819");
      for (let i = 0; i < 35; i++) pixelRect((i * 53) % 960, (i * 97) % 280, 3, 3, "#7ddcff");
      pixelRect(0, 380, 960, 160, "#11112c");
      pixelRect(90, 230, 140, 210, "#1d1b3f");
      pixelRect(330, 180, 170, 260, "#242054");
      pixelRect(620, 245, 180, 195, "#1d1b3f");
      [125, 165, 365, 425, 665, 720].forEach(x => pixelRect(x, 285, 22, 30, "#fff6a0"));
      pixelRect(456, 270, 48, 120, "#4cc9f0");
      pixelRect(436, 370, 88, 28, "#ffffff");
      line(120, 460, 840, 460, "#4cc9f0", 4);
      text("CASTLE TOWN", 318, 86, 42, "#ffffff");
    }

    function drawCardCastle() {
      clearScene("#050505");
      pixelRect(0, 400, 960, 140, "#181818");
      pixelRect(405, 140, 150, 300, "#ffffff");
      pixelRect(360, 220, 240, 40, "#ffffff");
      pixelRect(440, 80, 80, 80, "#ffffff");
      pixelRect(450, 250, 60, 96, "#000000");
      text("SPADE", 412, 56, 42, "#ffffff");
      text("\u2660", 456, 332, 60, "#ffffff");
      text("\u2665", 130, 190, 78, "#a00000");
      text("\u2666", 760, 210, 78, "#a00000");
      text("\u2663", 150, 355, 78, "#ffffff");
      text("\u2660", 740, 365, 78, "#ffffff");
    }

    function drawCyberField() {
      clearScene("#05051a");
      for (let x = 0; x < 960; x += 48) line(x, 0, 480, 540, "#1ef7ff", 2);
      for (let x = 0; x < 960; x += 48) line(x, 540, 480, 0, "#ff39f7", 2);
      for (let y = 300; y < 540; y += 34) line(0, y, 960, y, "#1ef7ff", 2);
      pixelRect(180, 160, 220, 70, "#ff39f7");
      pixelRect(560, 118, 240, 84, "#1ef7ff");
      text("CYBER", 205, 210, 42, "#ffffff");
      text("FIELD", 588, 174, 42, "#05051a");
      pixelRect(455, 320, 50, 120, "#ffff00");
    }

    function drawQueenMansion() {
      clearScene("#120824");
      pixelRect(0, 390, 960, 150, "#27143d");
      pixelRect(180, 150, 600, 270, "#ffffff");
      pixelRect(230, 110, 500, 70, "#ffd447");
      pixelRect(290, 230, 100, 190, "#35f7ff");
      pixelRect(570, 230, 100, 190, "#35f7ff");
      for (let x = 205; x < 780; x += 70) pixelRect(x, 185, 30, 35, "#1b1035");
      text("MANSION", 346, 82, 44, "#ffd447");
      text("100%", 415, 340, 44, "#1b1035");
    }

    function drawTvStudio() {
      clearScene("#090909");
      for (let x = 80; x < 900; x += 160) {
        line(x, 0, 470, 270, "#ffffff", 4);
        line(x + 70, 0, 510, 270, "#35f7ff", 4);
      }
      pixelRect(170, 145, 620, 250, "#1a1a1a");
      pixelRect(215, 185, 530, 170, "#ff2020");
      pixelRect(250, 220, 460, 100, "#ffffff");
      text("LIVE", 425, 294, 58, "#ff2020");
      pixelRect(0, 430, 960, 110, "#202020");
    }

    function drawHometown() {
      clearScene("#0b1020");
      pixelRect(0, 355, 960, 185, "#dff6ff");
      for (let x = 90; x < 840; x += 230) {
        pixelRect(x, 220, 150, 115, "#355c7d");
        line(x - 12, 220, x + 75, 145, "#ffffff", 8);
        line(x + 75, 145, x + 162, 220, "#ffffff", 8);
        pixelRect(x + 56, 270, 36, 65, "#1c2740");
        pixelRect(x + 104, 250, 26, 28, "#ffdd7a");
      }
      line(410, 540, 548, 355, "#a8a8a8", 38);
      text("HOMETOWN", 338, 94, 48, "#ffffff");
    }

    function drawSchool() {
      clearScene("#0f0f0f");
      pixelRect(0, 345, 960, 195, "#70462d");
      pixelRect(60, 80, 840, 270, "#b06935");
      for (let x = 110; x < 850; x += 90) {
        pixelRect(x, 125, 48, 185, "#d8d8d8");
        pixelRect(x + 8, 145, 32, 8, "#4a7a39");
        pixelRect(x + 8, 215, 32, 8, "#4a7a39");
      }
      pixelRect(420, 105, 120, 245, "#202020");
      text("CLOSET", 407, 74, 44, "#ffffff");
    }

    function drawDarkFountain() {
      clearScene("#000000");
      for (let i = 0; i < 32; i++) pixelRect((i * 131) % 960, (i * 61) % 500, 4, 4, "#5bf7ff");
      pixelRect(446, 70, 68, 410, "#ffffff");
      pixelRect(430, 220, 100, 250, "#5bf7ff");
      line(480, 90, 300, 460, "#ffffff", 8);
      line(480, 90, 660, 460, "#ffffff", 8);
      line(480, 130, 220, 360, "#202040", 10);
      line(480, 130, 740, 360, "#202040", 10);
      text("FOUNTAIN", 342, 520, 48, "#ffffff");
    }

    function chooseScene() {
      current = locations[Math.floor(Math.random() * locations.length)];
      const wrong = locations
        .filter(location => location !== current)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);
      return [current, ...wrong].sort(() => Math.random() - 0.5);
    }

    function newRound(advance) {
      if (advance) round++;
      locked = false;
      resultEl.textContent = "Pick one answer.";
      const options = chooseScene();
      current.draw();
      captionEl.textContent = current.caption;
      choicesEl.innerHTML = "";
      options.forEach(option => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.textContent = option.name;
        button.addEventListener("click", () => guess(button, option));
        choicesEl.appendChild(button);
      });
      updateStatus();
    }

    function guess(button, option) {
      if (locked) return;
      locked = true;
      const correct = option === current;
      button.classList.add(correct ? "correct" : "wrong");
      choicesEl.querySelectorAll(".choice").forEach(choice => {
        if (choice.textContent === current.name) choice.classList.add("correct");
      });
      if (correct) {
        const gained = 500 + streak * 100;
        score += gained;
        streak++;
        resultEl.textContent = "Correct. +" + gained + " points.";
        playTone(740, 0.12, "square");
        setTimeout(() => playTone(988, 0.14, "square"), 90);
      } else {
        streak = 0;
        resultEl.textContent = "Wrong. It was " + current.name + ".";
        playTone(170, 0.2, "sawtooth");
      }
      updateStatus();
    }

    function updateStatus() {
      roundEl.textContent = round;
      scoreEl.textContent = score;
      streakEl.textContent = streak;
    }

    document.getElementById("new-round").addEventListener("click", () => newRound(true));
    document.getElementById("skip-round").addEventListener("click", () => {
      streak = 0;
      playTone(240, 0.08, "square");
      newRound(true);
    });
    audioToggle.addEventListener("click", () => {
      audioEnabled = !audioEnabled;
      setAudioButton();
      playTone(audioEnabled ? 660 : 220, 0.09, "square");
    });

    setAudioButton();
    newRound(false);
  </script>
</body>
</html>
