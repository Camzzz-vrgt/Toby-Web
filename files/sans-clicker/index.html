<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Sans Clicker</title>
    <style>
        p {
            font-family: "Comic Sans MS", "Comic Sans", cursive;
        }

        :root {
            --main-bg-color: #000000;
            --text-color: #FFFFFF;
            --border-color: #FFFFFF;
            --accent-color: #00BFFF;
            --disabled-bg-color: #1a1a1a;
            --disabled-text-color: #555555;
            --hover-bg-color: #333333;
        }

        body {
            font-family: "Comic Sans MS", "Comic Sans", cursive;
            background-color: var(--main-bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 95%;
            max-width: 1000px;
            height: 90vh;
            max-height: 650px;
            border: 3px solid var(--border-color);
            box-shadow: 0 0 15px var(--accent-color);
        }

        .panel {
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .left-panel {
            width: 25%;
            border-right: 3px solid var(--border-color);
            justify-content: flex-start;
        }

        .middle-panel {
            width: 50%;
            justify-content: space-between;
            /* Changed for new layout */
            position: relative;
            /* For floating text positioning */
        }

        .right-panel {
            width: 25%;
            border-left: 3px solid var(--border-color);
        }

        h2 {
            text-align: center;
            margin: 0 0 15px 0;
            font-size: 2.5em;
            text-shadow: 3px 3px var(--accent-color);
        }

        h3 {
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        /* Middle Panel (Clicker) */
        #sans-container {
            text-align: center;
        }

        #sans-image {
            width: 250px;
            height: 300px;
            cursor: pointer;
            transition: transform 0.05s ease-out;
            image-rendering: pixelated;
            /* Keeps the pixel art sharp */
        }

        #sans-image:active {
            transform: scale(0.95) rotate(-2deg);
        }

        /* New Clicker Upgrade Styles */
        #click-upgrades-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 60px;
            /* Fixed height for the bar */
            border-bottom: 3px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            overflow-y: auto;
        }

        .click-upgrade {
            width: 50px;
            height: 50px;
            border: 2px solid var(--disabled-text-color);
            background-color: var(--disabled-bg-color);
            cursor: not-allowed;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            image-rendering: pixelated;
            opacity: 0.5;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .click-upgrade.affordable {
            border-color: var(--accent-color);
            cursor: pointer;
            opacity: 1;
        }

        .click-upgrade.affordable:hover {
            box-shadow: 0 0 10px var(--accent-color);
            transform: scale(1.1);
        }


        .floating-text {
            position: absolute;
            font-size: 2em;
            color: var(--text-color);
            pointer-events: none;
            animation: float-up 1.5s ease-out forwards;
            text-shadow: 2px 2px #000;
            font-weight: bold;
            z-index: 101;
        }

        @keyframes float-up {
            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 0;
                transform: translateY(-80px);
            }
        }

        #spinning-papyrus {
            position: absolute;
            width: 80px;
            height: 80px;
            cursor: pointer;
            z-index: 100;
            image-rendering: pixelated;
            animation: spin 2s linear infinite;
            display: none;
            /* Hidden by default */
        }

        #spinning-papyrus.visible {
            display: block;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Left Panel (Stats) */
        .stats-box {
            width: 100%;
            border: 2px solid var(--border-color);
            padding: 15px;
            margin-top: 20px;
            box-sizing: border-box;
        }

        .stat {
            font-size: 1.5em;
            margin-bottom: 12px;
            word-wrap: break-word;
        }

        #gold-display {
            font-size: 1.8em;
            color: yellow;
            font-weight: bold;
        }

        .save-container {
            margin-top: auto;
            text-align: center;
        }

        .save-button {
            padding: 10px 20px;
            font-family: "Comic Sans MS", "Comic Sans", cursive;
            font-size: 1.2em;
            cursor: pointer;
            background-color: var(--main-bg-color);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .save-button:hover {
            background-color: var(--accent-color);
            color: var(--main-bg-color);
            border-color: var(--accent-color);
        }

        #save-message {
            color: limegreen;
            visibility: hidden;
            margin-top: 10px;
            font-size: 1.1em;
        }

        /* Music Control Button */
        .music-control {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 8px 12px;
            font-family: "Comic Sans MS", "Comic Sans", cursive;
            font-size: 1em;
            cursor: pointer;
            background-color: var(--main-bg-color);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            transition: all 0.2s ease;
            z-index: 1000;
        }

        .music-control:hover {
            background-color: var(--accent-color);
            color: var(--main-bg-color);
            border-color: var(--accent-color);
        }

        /* Right Panel (Shop) */
        .shop-container {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            border: 2px solid var(--border-color);
            padding: 10px;
        }

        .shop-container::-webkit-scrollbar {
            width: 12px;
        }

        .shop-container::-webkit-scrollbar-track {
            background: #111;
        }

        .shop-container::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border: 2px solid var(--border-color);
        }

        .upgrade {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: var(--disabled-bg-color);
            border: 2px solid var(--disabled-text-color);
            color: var(--disabled-text-color);
            font-family: "Comic Sans MS", "Comic Sans", cursive;
            font-size: 1.2em;
            cursor: not-allowed;
            text-align: left;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade.affordable {
            background-color: var(--main-bg-color);
            color: var(--text-color);
            border-color: var(--border-color);
            cursor: pointer;
        }

        .upgrade.affordable:hover {
            background-color: var(--hover-bg-color);
            border-color: var(--accent-color);
        }

        .upgrade-details {
            font-size: 0.8em;
        }

        .upgrade-details-name {
            font-size: 1.2em;
            margin-bottom: 4px;
        }

        .upgrade-cost {
            font-weight: bold;
            color: yellow;
        }

        .upgrade-owned {
            font-size: 2em;
            color: var(--accent-color);
            padding-left: 10px;
        }

        /* Responsive Design */
        @media (max-width: 800px) {
            .container {
                flex-direction: column;
                height: 95vh;
                width: 95%;
                overflow-y: auto;
            }

            .panel {
                width: 100% !important;
                border: none !important;
                border-bottom: 3px solid var(--border-color) !important;
            }

            .right-panel {
                border-bottom: none !important;
            }

            #sans-image {
                width: 180px;
                height: 180px;
            }

            .save-container {
                margin-top: 20px;
                padding-bottom: 20px;
            }
        }
    </style>
</head>

        const saveButton = document.getElementById('save-button');
        const saveMessage = document.getElementById('save-message');
        const spinningPapyrus = document.getElementById('spinning-papyrus');
        const sansClickSound = document.getElementById('sans-click-sound');
        const genericClickSound = document.getElementById('generic-click-sound');
        const papyrusClickSound = document.getElementById('papyrus-click-sound');

        // Golden Papyrus variables
        let papyrusDespawnTimeout;
        let nextPapyrusSpawnTimeout;

        // --- Core Functions ---

        function formatNumber(num) {
            if (num < 1000) return num.toFixed(1);
            if (num < 1e6) return (num / 1e3).toFixed(2) + 'K';
            if (num < 1e9) return (num / 1e6).toFixed(2) + 'M';
            if (num < 1e12) return (num / 1e9).toFixed(2) + 'B';
            if (num < 1e15) return (num / 1e12).toFixed(2) + 'T';
            return num.toExponential(2);
        }

        function calculateCost(upgrade) {
            return Math.ceil(upgrade.baseCost * Math.pow(1.15, upgrade.owned));
        }

        function calculateGPC() {
            let gpc = 1;
            gameState.clickUpgrades.forEach(upg => {
                if (upg.purchased && upg.type === 'gpc_multiplier') {
                    gpc *= upg.value;
                }
            });
            return gpc;
        }

        function calculateGPS() {
            let totalGps = gameState.upgrades.reduce((sum, building) => {
                let buildingGps = building.owned * building.baseGps;
                gameState.clickUpgrades.forEach(upg => {
                    if (upg.purchased && upg.type === 'building_multiplier' && upg.targetId === building.id) {
                        buildingGps *= upg.value;
                    }
                });
                return sum + buildingGps;
            }, 0);

            gameState.clickUpgrades.forEach(upg => {
                if (upg.purchased && upg.type === 'global_multiplier') {
                    totalGps *= upg.value;
                }
            });

            return totalGps;
        }

        function updateDisplays() {
            const gpc = calculateGPC();
            const gps = calculateGPS();
            goldDisplay.textContent = formatNumber(gameState.gold);
            gpsDisplay.textContent = formatNumber(gps);
            gpcDisplay.textContent = formatNumber(gpc);
            document.title = `${formatNumber(gameState.gold)} G - Sans Clicker`;
        }

        function handleSansClick(event) {
            event.stopPropagation();
            sansClickSound.currentTime = 0;
            sansClickSound.play();

            const gpc = calculateGPC();
            gameState.gold += gpc;

            const floatingText = document.createElement('div');
            floatingText.textContent = `+${formatNumber(gpc)}`;
            floatingText.className = 'floating-text';

            const rect = middlePanel.getBoundingClientRect();
            const x = event.clientX - rect.left + (Math.random() * 40 - 20);
            const y = event.clientY - rect.top + (Math.random() * 40 - 20);

            floatingText.style.left = `${x}px`;
            floatingText.style.top = `${y}px`;

            middlePanel.appendChild(floatingText);

            setTimeout(() => { floatingText.remove(); }, 1500);

            updateDisplays();
            updateAllButtons();
        }

        // --- UI Update Functions ---

        function updateAllButtons() {
            updateShopButtons();
            updateClickUpgradeButtons();
        }

        // --- Shop Functions ---

        function buyUpgrade(id) {
            const upgrade = gameState.upgrades.find(u => u.id === id);
            const cost = calculateCost(upgrade);

            if (gameState.gold >= cost) {
                genericClickSound.currentTime = 0;
                genericClickSound.play();
                gameState.gold -= cost;
                upgrade.owned++;
                updateDisplays();
                populateShop();
                updateAllButtons();
            }
        }

        function populateShop() {
            shopContainer.innerHTML = '';
            gameState.upgrades.forEach(upgrade => {
                const cost = calculateCost(upgrade);
                const upgradeEl = document.createElement('button');
                upgradeEl.className = 'upgrade';
                upgradeEl.id = `upgrade-${upgrade.id}`;
                upgradeEl.onclick = (e) => {
                    e.stopPropagation();
                    buyUpgrade(upgrade.id);
                };

                const displayGps = upgrade.baseGps < 1000 ? upgrade.baseGps.toFixed(1) : formatNumber(upgrade.baseGps);

                upgradeEl.innerHTML = `
                    <div class="upgrade-info">
                        <div class="upgrade-details-name">${upgrade.name}</div>
                        <div class="upgrade-details">
                            Cost: <span class="upgrade-cost">${formatNumber(cost)} G</span><br>
                            +${displayGps} G/s each
                        </div>
                    </div>
                    <div class="upgrade-owned">${upgrade.owned}</div>
                `;
                shopContainer.appendChild(upgradeEl);
            });
        }

        function updateShopButtons() {
            gameState.upgrades.forEach(upgrade => {
                const cost = calculateCost(upgrade);
                const button = document.getElementById(`upgrade-${upgrade.id}`);
                if (button) {
                    if (gameState.gold >= cost) {
                        button.classList.add('affordable');
                    } else {
                        button.classList.remove('affordable');
                    }
                }
            });
        }

        // --- Click Upgrade Functions ---

        function populateClickUpgrades() {
            clickUpgradesContainer.innerHTML = '';
            gameState.clickUpgrades.forEach(upg => {
                if (!upg.purchased) {
                    const upgradeEl = document.createElement('div');
                    upgradeEl.id = upg.id;
                    upgradeEl.className = 'click-upgrade';
                    upgradeEl.style.backgroundImage = `url(${upg.icon})`;
                    upgradeEl.title = `${upg.name} - Cost: ${formatNumber(upg.cost)} G\n${upg.description}`;
                    upgradeEl.onclick = (e) => {
                        e.stopPropagation();
                        buyClickUpgrade(upg.id);
                    };
                    clickUpgradesContainer.appendChild(upgradeEl);
                }
            });
        }

        function buyClickUpgrade(id) {
            const upgrade = gameState.clickUpgrades.find(u => u.id === id);
            if (upgrade && !upgrade.purchased && gameState.gold >= upgrade.cost) {
                genericClickSound.currentTime = 0;
                genericClickSound.play();
                gameState.gold -= upgrade.cost;
                upgrade.purchased = true;
                populateClickUpgrades(); // Redraw to remove the purchased one
                updateDisplays();
                updateAllButtons();
            }
        }

        function updateClickUpgradeButtons() {
            gameState.clickUpgrades.forEach(upg => {
                if (!upg.purchased) {
                    const button = document.getElementById(upg.id);
                    if (button) {
                        if (gameState.gold >= upg.cost) {
                            button.classList.add('affordable');
                        } else {
                            button.classList.remove('affordable');
                        }
                    }
                }
            });
        }

        // --- Golden Papyrus Functions ---

        function scheduleNextPapyrus() {
            clearTimeout(nextPapyrusSpawnTimeout);
            const nextSpawnTime = Math.random() * 10000 + 20000;
            nextPapyrusSpawnTimeout = setTimeout(spawnPapyrus, nextSpawnTime);
        }

        function spawnPapyrus() {
            if (spinningPapyrus.classList.contains('visible')) return;

            const panelRect = middlePanel.getBoundingClientRect();
            const papyrusSize = 80;

            const x = Math.random() * (panelRect.width - papyrusSize);
            const y = Math.random() * (panelRect.height - papyrusSize);

            spinningPapyrus.style.left = `${x}px`;
            spinningPapyrus.style.top = `${y}px`;
            spinningPapyrus.classList.add('visible');

            papyrusDespawnTimeout = setTimeout(() => {
                spinningPapyrus.classList.remove('visible');
                scheduleNextPapyrus();
            }, 10000);
        }

        function handlePapyrusClick(event) {
            event.stopPropagation();
            if (!spinningPapyrus.classList.contains('visible')) return;

            papyrusClickSound.currentTime = 0;
            papyrusClickSound.play();

            clearTimeout(papyrusDespawnTimeout);

            const gps = calculateGPS();
            const reward = Math.max(1000, gps * 900);
            gameState.gold += reward;

            const floatingText = document.createElement('div');
            floatingText.textContent = `NYEH HEH HEH! +${formatNumber(reward)} G`;
            floatingText.className = 'floating-text';
            floatingText.style.left = spinningPapyrus.style.left;
            floatingText.style.top = spinningPapyrus.style.top;
            floatingText.style.color = 'gold';
            middlePanel.appendChild(floatingText);
            setTimeout(() => floatingText.remove(), 1500);

            spinningPapyrus.classList.remove('visible');
            scheduleNextPapyrus();
            updateDisplays();
            updateAllButtons();
        }


        // --- Save/Load Functions ---

        function saveGame(event) {
            if (event) {
                event.stopPropagation();
                genericClickSound.currentTime = 0;
                genericClickSound.play();
            }
            try {
                localStorage.setItem('sansClickerSave', JSON.stringify(gameState));
                saveMessage.style.visibility = 'visible';
                setTimeout(() => { saveMessage.style.visibility = 'hidden'; }, 2000);
            } catch (e) { console.error("Could not save game:", e); }
        }

        function loadGame() {
            try {
                const savedGame = localStorage.getItem('sansClickerSave');
                if (savedGame) {
                    const loadedState = JSON.parse(savedGame);
                    gameState.gold = loadedState.gold || 0;
                    gameState.upgrades.forEach(defaultUpgrade => {
                        const savedUpgrade = loadedState.upgrades.find(su => su.id === defaultUpgrade.id);
                        if (savedUpgrade) {
                            defaultUpgrade.owned = savedUpgrade.owned || 0;
                        }
                    });
                    gameState.clickUpgrades.forEach(defaultUpgrade => {
                        const savedUpgrade = loadedState.clickUpgrades?.find(su => su.id === defaultUpgrade.id);
                        if (savedUpgrade) {
                            defaultUpgrade.purchased = savedUpgrade.purchased || false;
                        }
                    });
                }
            } catch (e) { console.error("Could not load game:", e); }
        }

        // --- Game Loop and Initialization ---

        function gameLoop() {
            const gps = calculateGPS();
            gameState.gold += gps / 10;
            updateDisplays();
            updateAllButtons();
        }

        function init() {
            loadGame();
            populateShop();
            populateClickUpgrades();

            sansImage.addEventListener('click', handleSansClick);
            saveButton.addEventListener('click', saveGame);
            spinningPapyrus.addEventListener('click', handlePapyrusClick);

            scheduleNextPapyrus();
            setInterval(gameLoop, 100);
            setInterval(() => saveGame(undefined), 30000); // Pass undefined for autosave
        }

        init();
    </script>
    <script src="../mobile-controls.js"></script>
</body>

</html>
