<style id="dul-port-style">
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #game-shell { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; }
    #MMFCanvas { max-width: 100vw; max-height: 100vh; width: 100vw; height: auto; aspect-ratio: 16 / 9; object-fit: contain; image-rendering: pixelated !important; image-rendering: crisp-edges !important; }
  </style>

<body>

<div id="game-shell">
    <canvas id="MMFCanvas" width="960" height="540">
    	Your browser does not support Canvas.
    </canvas>
</div>

<script>
    // RUNTIMESTART
    // This is where the HTML5 runtime is actually started
    window.addEventListener("load", windowLoaded, false);
    function windowLoaded()
    {
        // Calls the runtime
        // First parameter : name of the canvas element
        // Second parameter : path to the cch file. Images and sounds must lay beside this file
        new Runtime("MMFCanvas", "https://raw.githubusercontent.com/storynetwork-camzzz/DUL/main/files/kromer-kollector-neo/resources/KromerKollectorNEOHTML.cch");
    }
    // RUNTIMESTARTEND
</script>
