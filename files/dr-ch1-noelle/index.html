<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DR. CHAP.1 NOELLE EDITION</title>
  <link rel="icon" type="image/webp" href="icon.webp">
  <style>
    :root { color-scheme: dark; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; }
    body { display: grid; place-items: center; overflow: hidden; }
    #canvas { display: block; width: min(100vw, calc(100vh * 4 / 3)); height: min(100vh, calc(100vw * 3 / 4)); aspect-ratio: 4 / 3; image-rendering: pixelated; background: #000; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #fff; background: #000; font: 14px/1.5 monospace; white-space: pre-wrap; text-align: center; z-index: 2; }
    #status[data-ready="true"] { display: none; }
    #status[data-error="true"] { display: block; overflow: auto; text-align: left; color: #ff9a9a; }
  </style>
</head>
<body>
  <canvas id="canvas" width="640" height="480" tabindex="0"></canvas>
  <div id="status">Preparing Noelle Edition...</div>
  <script type="module">
    import { startButterscotch } from "../butterscotch-host.js";

    const VERSION = "dr-ch1-noelle-butterscotch-v3";
    const status = document.querySelector("#status");
    const canvas = document.querySelector("#canvas");

    function setStatus(message) { status.textContent = message; }
    function fail(error) {
      console.error(error);
      status.dataset.error = "true";
      status.textContent = `Noelle Edition failed to start.\n\n${error?.stack || error}`;
    }

    async function getDirectory(root, path) {
      let directory = root;
      for (const segment of path.split("/").filter(Boolean)) directory = await directory.getDirectoryHandle(segment, { create: true });
      return directory;
    }

    async function writeFile(root, path, bytes) {
      const parts = path.split("/").filter(Boolean);
      const name = parts.pop();
      const directory = await getDirectory(root, parts.join("/"));
      const handle = await directory.getFileHandle(name, { create: true });
      const writable = await handle.createWritable();
      try { await writable.write(bytes); } finally { await writable.close(); }
    }

    async function fetchBytes(path) {
      const response = await fetch(path, { cache: "no-store" });
      if (!response.ok) throw new Error(`Missing local asset: ${path} (${response.status})`);
      return response.arrayBuffer();
    }

    async function stageFiles() {
      const root = await navigator.storage.getDirectory();
      const marker = await root.getFileHandle("dr-ch1-noelle.version", { create: true });
      const current = await (await marker.getFile()).text();
      if (current.trim() === VERSION) return;

      const gameDirectory = await getDirectory(root, "games/dr-ch1-noelle");
      await getDirectory(root, "saves/dr-ch1-noelle");
      const rootAssets = JSON.parse(new TextDecoder().decode(await fetchBytes("root-manifest.json")));
      const music = JSON.parse(new TextDecoder().decode(await fetchBytes("mus-manifest.json")));
      const files = ["data.win", "lang/lang_en.json", "lang/lang_ja.json", ...rootAssets, ...music.map(name => `mus/${name}`)];
      let complete = 0;
      for (const file of files) {
        await writeFile(gameDirectory, file, await fetchBytes(file));
        complete += 1;
        setStatus(`Preparing Noelle Edition... ${Math.round((complete / files.length) * 100)}%`);
      }

      const writable = await marker.createWritable();
      try { await writable.write(VERSION); } finally { await writable.close(); }
    }

    async function start() {
      await stageFiles();
      if (!window.crossOriginIsolated) throw new Error("This game requires cross-origin isolation. Start Toby Web with start-local.bat.");
      setStatus("Loading the Noelle Edition runner...");
      window.__tobyWebNoelleHost = await startButterscotch({
        canvas,
        gamePath: "/butterscotch/games/dr-ch1-noelle/data.win",
        savePath: "/butterscotch/saves/dr-ch1-noelle",
        releaseDelay: 40,
      });
      window.__tobyWebNoelleReady = true;
      status.dataset.ready = "true";
      canvas.focus();
    }

    start().catch(fail);
  </script>
  <script src="/files/mobile-controls.js" defer></script>
</body>
</html>
