<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading Toby Web...</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: monospace;
    }
    body {
      display: grid;
      place-items: center;
      text-align: center;
    }
    main { width: min(92vw, 620px); }
    h1 { margin: 0 0 18px; font-size: clamp(28px, 7vw, 54px); letter-spacing: 0; }
    p { margin: 8px 0; font-size: 16px; line-height: 1.5; }
    .bar { height: 12px; margin-top: 24px; border: 2px solid #fff; }
    .fill { width: 35%; height: 100%; background: #fff; animation: load 1.1s steps(6) infinite; }
    .error { color: #ff5555; }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(285%); } }
  </style>
</head>
<body>
  <main>
    <h1>TOBY WEB</h1>
    <p id="status">Loading the newest version from GitHub...</p>
    <div class="bar" aria-hidden="true"><div class="fill"></div></div>
  </main>
  <script>
    (() => {
      const REPOSITORY = "Camzzz-vrgt/Toby-Web";
      const BRANCH = "main";
      const ASSET_BASE = `https://cdn.jsdelivr.net/gh/${REPOSITORY}@${BRANCH}/`;
      const sources = [
        `https://raw.githubusercontent.com/${REPOSITORY}/${BRANCH}/index.html`,
        `${ASSET_BASE}index.html`,
      ];

      const status = document.getElementById("status");

      async function fetchLatestLauncher() {
        let lastError;
        for (const source of sources) {
          try {
            const separator = source.includes("?") ? "&" : "?";
            const response = await fetch(`${source}${separator}t=${Date.now()}`, {
              cache: "no-store",
              mode: "cors",
            });
            if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
            return await response.text();
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error("The latest launcher could not be downloaded.");
      }

      function installAssetBase(html) {
        const base = `<base href="${ASSET_BASE}">`;
        if (/<base\s/i.test(html)) {
          return html.replace(/<base\b[^>]*>/i, base);
        }
        return html.replace(/<head(\s[^>]*)?>/i, match => `${match}\n  ${base}`);
      }

      fetchLatestLauncher()
        .then(installAssetBase)
        .then(html => {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(error => {
          document.querySelector(".bar")?.remove();
          status.className = "error";
          status.textContent = `Toby Web could not load: ${error.message}`;
        });
    })();
  </script>
</body>
</html>
